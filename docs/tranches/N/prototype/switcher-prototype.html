<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stage — Volumetric Theatre · candidate-a</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* =====================================================================
   STAGE — VOLUMETRIC THEATRE  ·  candidate-a (rebuild)
   A genuinely volumetric god-ray spotlight descending onto a dimmed
   grid-paper turntable. Real CSS 3D, theme-adaptive liquid-glass cards,
   7 faithful live mini-scene previews, single-rAF critically-damped spring.

   NOTE: the real impl dogfoods @mkbabb/keyframes.js SpringProgress on
   RAFPlayback (the LIGHT barrel) for the carousel spring + the light-pool
   tracking. The inline critically-damped spring below is a stand-in that
   matches SpringProgress's closed-form damped step (single rAF, correct dt).
   ===================================================================== */

:root {
    /* ── Demo theme: warm near-white paper / deep warm ink ── */
    --paper: hsl(38 44% 96%);          /* warm near-white substrate (light) */
    --foreground: hsl(28 18% 16%);     /* deep warm ink on paper (light) */
    --plate: hsl(40 40% 99%);

    /* grid-paper tokens (verbatim from the demo) */
    --graph-pitch: 1rem;
    --graph-major: 5rem;
    --graph-opacity: 3%;
    --graph-major-opacity: 11%;

    /* crayon accents (cube facets / amiga red), used TASTEFULLY (desaturated) */
    --c-red:     #f00;
    --c-green:   #0f0;
    --c-blue:    #00f;
    --c-yellow:  #ff0;
    --c-magenta: #f0f;
    --c-cyan:    #0ff;
    --amiga-red: #f04242;

    /* warm theatre downlight */
    --warm-light: 44 90% 72%;          /* hsl triplet — warm amber-white */
    --warm-core:  46 96% 86%;

    --font-display: "Instrument Serif", Georgia, serif;
    --font-mono: "Fira Code", ui-monospace, monospace;

    /* glass card surface (theme-adaptive via color-mix on --foreground/--paper) */
    --glass-tint: var(--paper);
    --glass-ink:  var(--foreground);

    /* stage chrome text stays theatre-light (invariant) regardless of theme */
    --stage-text: hsl(46 60% 94%);
    --stage-text-dim: hsl(44 22% 78%);
}

.dark {
    color-scheme: dark;
    --paper: hsl(28 16% 9%);           /* deep warm ink substrate (dark) */
    --foreground: hsl(40 36% 90%);     /* light warm ink on dark */
    --plate: hsl(26 16% 12%);
    --graph-opacity: 5.5%;
    --graph-major-opacity: 14%;
    --glass-tint: hsl(30 14% 14%);
    --glass-ink: var(--foreground);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

body {
    background: var(--paper);
    color: var(--foreground);
    font-family: var(--font-mono);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background 600ms cubic-bezier(.4,0,.2,1), color 600ms cubic-bezier(.4,0,.2,1);
}

/* the app */
#app {
    position: fixed;
    inset: 0;
    perspective: 1000px;             /* FIX #1/#3 — strong stage perspective */
    perspective-origin: 50% 38%;
    overflow: hidden;
}

/* =====================================================================
   GRID-PAPER substrate (FIX #5) — the real demo paper, then dimmed by the
   downlight via the radial vignette mask layers below it.
   ===================================================================== */
.grid-paper {
    position: absolute;
    inset: -10%;
    --graph-line-fine:  color-mix(in srgb, var(--foreground) var(--graph-opacity), transparent);
    --graph-line-major: color-mix(in srgb, var(--foreground) var(--graph-major-opacity), transparent);
    background-color: var(--paper);
    background-image:
        linear-gradient(to right,  var(--graph-line-major) 1px, transparent 1px),
        linear-gradient(to bottom, var(--graph-line-major) 1px, transparent 1px),
        linear-gradient(to right,  var(--graph-line-fine)  1px, transparent 1px),
        linear-gradient(to bottom, var(--graph-line-fine)  1px, transparent 1px);
    background-size:
        var(--graph-major) var(--graph-major),
        var(--graph-major) var(--graph-major),
        var(--graph-pitch) var(--graph-pitch),
        var(--graph-pitch) var(--graph-pitch);
    transition: background-color 600ms cubic-bezier(.4,0,.2,1);
}

/* FIX #4 + #5 — the downlight VIGNETTE: dim the paper at the edges, keep it
   lit (and clearly paper) in the pool. Tuned so darks are LIFTED — the edge
   is a soft warm shade, never near-black. The mask center tracks the light. */
.paper-vignette {
    position: absolute;
    inset: -10%;
    pointer-events: none;
    background:
        radial-gradient(120% 95% at var(--pool-x, 50%) 84%,
            transparent 0%,
            transparent 30%,
            hsl(26 22% 6% / 0.16) 58%,
            hsl(26 24% 5% / 0.34) 100%);
    mix-blend-mode: multiply;
    transition: background 240ms linear;
}
:root:not(.dark) .paper-vignette {
    background:
        radial-gradient(120% 95% at var(--pool-x, 50%) 84%,
            transparent 0%,
            transparent 34%,
            hsl(30 30% 30% / 0.10) 60%,
            hsl(28 30% 24% / 0.20) 100%);
}
/* a warm pool of LIGHT washing the paper directly under the beam */
.paper-pool {
    position: absolute;
    inset: -10%;
    pointer-events: none;
    background:
        radial-gradient(46% 30% at var(--pool-x, 50%) 78%,
            hsl(var(--warm-light) / 0.22) 0%,
            hsl(var(--warm-light) / 0.10) 40%,
            transparent 72%);
    mix-blend-mode: screen;
    transition: background 240ms linear, opacity 600ms ease;
    opacity: var(--light-energy, 1);
}

/* =====================================================================
   THE VOLUMETRIC GOD-RAY (FIX C + #7) — layered translucent cones,
   drifting dust motes, a soft floor-pool bloom. Lives ABOVE the paper,
   BELOW the stage cards (z so cards catch the light but aren't washed).
   ===================================================================== */
.beam-wrap {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    transition: opacity 900ms cubic-bezier(.22,1,.36,1);
    will-change: opacity, transform;
}
.beam-wrap.lit { opacity: 1; }

/* the light source — a hot point above the stage */
.beam-source {
    position: absolute;
    left: var(--beam-x, 50%);
    top: -4%;
    width: 14vw; height: 14vw;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, hsl(var(--warm-core) / 0.9) 0%, hsl(var(--warm-light) / 0.5) 28%, transparent 68%);
    filter: blur(6px);
    opacity: var(--light-energy, 1);
    transition: left 260ms cubic-bezier(.22,1,.36,1), opacity 200ms linear;
}

/* the cone shafts — three stacked translucent trapezoids of warm light,
   each a clip-path cone widening to the floor; layered for volume. */
.cone {
    position: absolute;
    left: var(--beam-x, 50%);
    top: -2%;
    height: 96%;
    transform: translateX(-50%);
    transform-origin: 50% 0%;
    mix-blend-mode: screen;
    transition: left 260ms cubic-bezier(.22,1,.36,1);
    filter: blur(1px);
}
.cone-1 {
    width: 62vw;
    clip-path: polygon(46% 0%, 54% 0%, 88% 100%, 12% 100%);
    background: linear-gradient(to bottom,
        hsl(var(--warm-core) / calc(0.30 * var(--light-energy,1))) 0%,
        hsl(var(--warm-light) / calc(0.13 * var(--light-energy,1))) 42%,
        hsl(var(--warm-light) / calc(0.04 * var(--light-energy,1))) 78%,
        transparent 100%);
}
.cone-2 {
    width: 44vw;
    clip-path: polygon(45% 0%, 55% 0%, 80% 100%, 20% 100%);
    background: linear-gradient(to bottom,
        hsl(var(--warm-core) / calc(0.34 * var(--light-energy,1))) 0%,
        hsl(var(--warm-light) / calc(0.16 * var(--light-energy,1))) 46%,
        transparent 92%);
    filter: blur(3px);
}
.cone-3 {
    width: 26vw;
    clip-path: polygon(44% 0%, 56% 0%, 72% 100%, 28% 100%);
    background: linear-gradient(to bottom,
        hsl(var(--warm-core) / calc(0.42 * var(--light-energy,1))) 0%,
        hsl(var(--warm-light) / calc(0.18 * var(--light-energy,1))) 50%,
        transparent 96%);
    filter: blur(5px);
}

/* the bloom where the beam meets the floor pool */
.beam-bloom {
    position: absolute;
    left: var(--beam-x, 50%);
    bottom: 8%;
    width: 44vw; height: 22vw;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center,
        hsl(var(--warm-core) / calc(0.32 * var(--light-energy,1))) 0%,
        hsl(var(--warm-light) / calc(0.14 * var(--light-energy,1))) 36%,
        transparent 72%);
    mix-blend-mode: screen;
    filter: blur(8px);
    transition: left 260ms cubic-bezier(.22,1,.36,1);
}

/* drifting dust motes inside the cone (canvas-free, pure CSS) */
/* in LIGHT theme the screen-blended cone washes out against bright paper;
   give the whole beam a touch more presence so it stays a real light shaft. */
:root:not(.dark) .beam-wrap { filter: saturate(1.05) contrast(1.06) brightness(1.04); }
.motes { position: absolute; inset: 0; mix-blend-mode: screen; opacity: calc(0.7 * var(--light-energy,1)); }
.mote {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, hsl(var(--warm-core) / 0.9), transparent 70%);
    filter: blur(.4px);
    animation: drift linear infinite;
}
@keyframes drift {
    0%   { transform: translate(0, 0) scale(.7); opacity: 0; }
    12%  { opacity: .9; }
    88%  { opacity: .7; }
    100% { transform: translate(var(--mx, 14px), -120px) scale(1.1); opacity: 0; }
}

/* =====================================================================
   THE TURNTABLE STAGE (FIX #1, #3) — a tilted 3D plane carrying the ring.
   ===================================================================== */
.stage {
    position: absolute;
    inset: 0;
    z-index: 3;
    transform-style: preserve-3d;
    display: grid;
    place-items: center;
    opacity: 0;
    transform: translateZ(-260px) scale(.96);
    transition: opacity 900ms cubic-bezier(.22,1,.36,1),
                transform 1100ms cubic-bezier(.22,1,.36,1),
                filter 900ms ease;
    filter: blur(6px);
}
.stage.active {
    opacity: 1;
    transform: translateZ(0) scale(1);
    filter: blur(0);
}

/* the turntable disc — a deep physical platter the ring sits on */
.turntable {
    position: relative;
    width: min(86vw, 1180px);
    height: min(58vh, 560px);
    transform-style: preserve-3d;
    /* FIX #3 — the plane faces the user tilted ~22deg downward */
    transform: rotateX(22deg);
    margin-top: 6vh;
}

/* the physical platter ellipse on the floor (reads as a real turntable) */
.platter {
    position: absolute;
    left: 50%; top: 60%;
    width: 118%; height: 64%;
    transform: translate(-50%, -50%) translateZ(-1px);
    border-radius: 50%;
    background:
        radial-gradient(ellipse at 50% 42%,
            hsl(var(--warm-light) / calc(0.10 * var(--light-energy,1))) 0%,
            transparent 62%),
        radial-gradient(ellipse at 50% 50%,
            color-mix(in srgb, var(--foreground) 9%, transparent) 0%,
            color-mix(in srgb, var(--foreground) 5%, transparent) 54%,
            transparent 78%);
    border: 1px solid color-mix(in srgb, var(--foreground) 10%, transparent);
    box-shadow:
        inset 0 2px 30px color-mix(in srgb, var(--foreground) 8%, transparent),
        0 30px 70px hsl(26 24% 4% / 0.4);
}
/* concentric turntable groove rings */
.platter::after {
    content: "";
    position: absolute; inset: 8%;
    border-radius: 50%;
    background:
        repeating-radial-gradient(circle at 50% 50%,
            transparent 0 6px,
            color-mix(in srgb, var(--foreground) 4%, transparent) 6px 7px);
    opacity: .6;
    -webkit-mask: radial-gradient(ellipse at 50% 50%, #000 50%, transparent 80%);
            mask: radial-gradient(ellipse at 50% 50%, #000 50%, transparent 80%);
}

/* the ring that the cards are positioned on (3D) */
.ring {
    position: absolute;
    left: 50%; top: 48%;
    width: 0; height: 0;
    transform-style: preserve-3d;
}

/* =====================================================================
   CARDS (FIX A) — theme-adaptive LIQUID GLASS, never black slabs.
   ===================================================================== */
.card {
    position: absolute;
    left: 0; top: 0;
    width: 220px; height: 290px;
    margin-left: -110px; margin-top: -145px;
    transform-style: preserve-3d;
    border-radius: 22px;
    cursor: pointer;
    /* placement is set per-frame in JS via transform (translate3d + scale) */
    will-change: transform, opacity, filter;
    /* the GLASS body */
    background:
        linear-gradient(145deg,
            color-mix(in srgb, var(--glass-tint) 62%, transparent) 0%,
            color-mix(in srgb, var(--glass-tint) 42%, transparent) 100%);
    backdrop-filter: blur(7px) saturate(118%);
    -webkit-backdrop-filter: blur(7px) saturate(118%);
    border: 1px solid color-mix(in srgb, var(--glass-ink) 16%, transparent);
    box-shadow:
        0 1px 0 color-mix(in srgb, white 24%, transparent) inset,
        0 -1px 0 color-mix(in srgb, var(--glass-ink) 14%, transparent) inset,
        0 24px 48px hsl(26 24% 4% / 0.32);
    overflow: hidden;
    transition: box-shadow 240ms ease;
}
/* specular catch-light sweeping the glass (FIX A — premium, not a rectangle) */
.card::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background:
        linear-gradient(135deg,
            color-mix(in srgb, white 30%, transparent) 0%,
            transparent 26%),
        radial-gradient(140% 70% at 30% -10%,
            color-mix(in srgb, white 22%, transparent) 0%,
            transparent 50%);
    pointer-events: none;
    opacity: .8;
}
/* thin glass rim highlight */
.card::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    border: 1px solid transparent;
    background:
        linear-gradient(160deg,
            color-mix(in srgb, white 30%, transparent),
            transparent 30%,
            transparent 70%,
            color-mix(in srgb, var(--glass-ink) 10%, transparent)) border-box;
    -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none;
}
.card.front {
    box-shadow:
        0 1px 0 color-mix(in srgb, white 34%, transparent) inset,
        0 -1px 0 color-mix(in srgb, var(--glass-ink) 16%, transparent) inset,
        0 0 0 1px hsl(var(--warm-light) / 0.30),
        0 30px 70px hsl(26 24% 4% / 0.4),
        0 0 60px hsl(var(--warm-light) / calc(0.22 * var(--light-energy,1)));
}

.card-stage {
    position: absolute;
    left: 12px; right: 12px; top: 12px;
    height: 196px;
    border-radius: 14px;
    overflow: hidden;
    background:
        radial-gradient(120% 80% at 50% 0%,
            color-mix(in srgb, var(--glass-tint) 30%, transparent),
            color-mix(in srgb, var(--paper) 40%, transparent));
    border: 1px solid color-mix(in srgb, var(--glass-ink) 10%, transparent);
    box-shadow: inset 0 2px 14px hsl(26 24% 4% / 0.22);
}
/* a faint grid-paper INSIDE each preview stage so they read on-brand */
.card-stage::before {
    content: ""; position: absolute; inset: 0; opacity: .5;
    background-image:
        linear-gradient(to right,  color-mix(in srgb, var(--glass-ink) 7%, transparent) 1px, transparent 1px),
        linear-gradient(to bottom, color-mix(in srgb, var(--glass-ink) 7%, transparent) 1px, transparent 1px);
    background-size: 16px 16px, 16px 16px;
    pointer-events: none;
}

.card-label {
    position: absolute;
    left: 14px; right: 14px; bottom: 12px;
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px;
}
.card-name {
    font-family: var(--font-display);
    font-size: 30px;
    line-height: 1;
    letter-spacing: .2px;
    color: var(--glass-ink);
}
.card-idx {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .5px;
    color: color-mix(in srgb, var(--glass-ink) 60%, transparent);
}

/* =====================================================================
   PREVIEW MINI-SCENES (FIX #2, B) — refined, desaturated crayon readouts.
   ===================================================================== */
.pv { position: absolute; inset: 0; display: grid; place-items: center; }

/* desaturated crayon helpers — tasteful instrument tones, not neon */
:root {
    --p-red:     color-mix(in srgb, var(--c-red)     62%, #c9b6a4);
    --p-green:   color-mix(in srgb, var(--c-green)   48%, #b4c2a2);
    --p-blue:    color-mix(in srgb, var(--c-blue)    60%, #b6bccc);
    --p-yellow:  color-mix(in srgb, var(--c-yellow)  52%, #cabf98);
    --p-magenta: color-mix(in srgb, var(--c-magenta) 52%, #ccaec0);
    --p-cyan:    color-mix(in srgb, var(--c-cyan)    48%, #a6c0c4);
    --p-amiga:   color-mix(in srgb, var(--amiga-red) 80%, #d8aa9a);
}

/* --- Cube: a REAL 3D CSS cube, 6 crayon faces, slow X+Y spin --- */
.cube-scene { perspective: 320px; }
.cube { width: 64px; height: 64px; transform-style: preserve-3d; animation: cubespin 14s linear infinite; }
@keyframes cubespin {
    0%   { transform: rotateX(-22deg) rotateY(0deg); }
    100% { transform: rotateX(-22deg) rotateY(360deg); }
}
.cube .f {
    position: absolute; width: 64px; height: 64px;
    border: 1px solid color-mix(in srgb, var(--glass-ink) 30%, transparent);
    border-radius: 4px;
    display: grid; place-items: center;
    font-family: var(--font-mono); font-weight: 600; font-size: 22px;
    color: color-mix(in srgb, var(--glass-ink) 70%, white);
    text-shadow: 0 1px 2px rgba(0,0,0,.3);
    box-shadow: inset 0 0 18px rgba(255,255,255,.18);
}
.cube .f1 { background: color-mix(in srgb, var(--p-red)     78%, transparent); transform: translateZ(32px); }
.cube .f2 { background: color-mix(in srgb, var(--p-green)   78%, transparent); transform: rotateY(90deg) translateZ(32px); }
.cube .f3 { background: color-mix(in srgb, var(--p-blue)    78%, transparent); transform: rotateY(180deg) translateZ(32px); }
.cube .f4 { background: color-mix(in srgb, var(--p-yellow)  78%, transparent); transform: rotateY(-90deg) translateZ(32px); }
.cube .f5 { background: color-mix(in srgb, var(--p-magenta) 78%, transparent); transform: rotateX(90deg) translateZ(32px); }
.cube .f6 { background: color-mix(in srgb, var(--p-cyan)    78%, transparent); transform: rotateX(-90deg) translateZ(32px); }

/* --- Amiga: red/white checker sphere BOUNCING with squash --- */
.amiga-floor { position: absolute; left: 18%; right: 18%; bottom: 26%; height: 2px; background: color-mix(in srgb, var(--glass-ink) 22%, transparent); }
.boing-wrap { position: absolute; left: 50%; bottom: 30%; transform: translateX(-50%); animation: boingY 1.6s cubic-bezier(.5,0,.5,1) infinite; }
.boing {
    width: 56px; height: 56px; border-radius: 50%;
    background:
        radial-gradient(circle at 34% 30%, rgba(255,255,255,.9) 0%, transparent 36%),
        repeating-conic-gradient(from 0deg,
            var(--p-amiga) 0deg 30deg, #f4ede4 30deg 60deg);
    -webkit-mask: radial-gradient(circle at 50% 50%, #000 49%, transparent 50%);
            mask: radial-gradient(circle at 50% 50%, #000 49%, transparent 50%);
    box-shadow: inset -8px -8px 16px rgba(0,0,0,.28), inset 6px 6px 14px rgba(255,255,255,.3);
    animation: boingSquash 1.6s cubic-bezier(.5,0,.5,1) infinite, boingSpin 3.2s linear infinite;
}
@keyframes boingY { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-56px); } }
@keyframes boingSquash { 0%,44%,56%,100% { transform: scale(1,1); } 50% { transform: scale(1.04,.94); } 2%,98% { transform: scale(1.14,.82); } }
@keyframes boingSpin { 0% { background-position: 0; } 100% { background-position: 60px; } }

/* --- Square: rounded crayon-green box drifting + scaling + rotating --- */
.sq {
    width: 76px; height: 76px; border-radius: 16px;
    background: linear-gradient(145deg,
        color-mix(in srgb, var(--p-green) 80%, transparent),
        color-mix(in srgb, var(--p-green) 50%, transparent));
    border: 1px solid color-mix(in srgb, var(--glass-ink) 24%, transparent);
    box-shadow: inset 0 2px 10px rgba(255,255,255,.3), 0 8px 18px hsl(26 24% 4% / .3);
    display: grid; place-items: center;
    color: color-mix(in srgb, var(--glass-ink) 60%, white);
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .4px;
    animation: sqdrift 5s ease-in-out infinite;
}
@keyframes sqdrift {
    0%,100% { transform: translate(-10px,4px) rotate(-6deg) scale(.96); }
    50%     { transform: translate(10px,-4px) rotate(6deg) scale(1.06); }
}

/* --- Easing: SVG bezier curve + ball sweeping with a fading trace --- */
.ease-svg { width: 86%; height: 86%; }
.ease-curve { fill: none; stroke: color-mix(in srgb, var(--p-blue) 70%, var(--glass-ink)); stroke-width: 2.4; opacity: .85; }
.ease-grid { stroke: color-mix(in srgb, var(--glass-ink) 14%, transparent); stroke-width: 1; }
.ease-ball { fill: var(--p-red); filter: drop-shadow(0 0 4px color-mix(in srgb, var(--p-red) 60%, transparent)); }
.ease-trace { fill: none; stroke: var(--p-red); stroke-width: 2; opacity: .35; stroke-linecap: round; }

/* --- Spring: rail + needle springing to target, damped ring --- */
.spring-rail { position: absolute; left: 16%; right: 16%; top: 50%; height: 3px; border-radius: 2px;
    background: color-mix(in srgb, var(--glass-ink) 16%, transparent); }
.spring-target { position: absolute; right: 18%; top: 50%; width: 2px; height: 26px; transform: translateY(-50%);
    background: color-mix(in srgb, var(--p-red) 70%, transparent); opacity: .6; }
.spring-needle { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; transform: translate(-50%,-50%);
    background: radial-gradient(circle at 34% 30%, #fff, var(--p-red) 70%);
    box-shadow: 0 0 10px color-mix(in srgb, var(--p-red) 60%, transparent);
    left: 18%; animation: springgo 2.8s cubic-bezier(.16,1.2,.3,1) infinite; }
@keyframes springgo {
    0%    { left: 18%; }
    52%   { left: 82%; }
    60%   { left: 78%; }
    68%   { left: 81%; }
    76%   { left: 79.5%; }
    84%,100% { left: 82%; }
}

/* --- Sequence: 5 bars cascade in a staggered wave --- */
.seq { display: flex; gap: 9px; align-items: flex-end; height: 86px; }
.seq-bar { width: 12px; border-radius: 4px;
    background: linear-gradient(to top,
        color-mix(in srgb, var(--p-magenta) 70%, transparent),
        color-mix(in srgb, var(--p-cyan) 60%, transparent));
    box-shadow: inset 0 1px 2px rgba(255,255,255,.3);
    transform-origin: bottom; animation: seqwave 2.4s ease-in-out infinite; }
.seq-bar:nth-child(1) { animation-delay: 0s;    height: 28px; }
.seq-bar:nth-child(2) { animation-delay: .12s;  height: 44px; }
.seq-bar:nth-child(3) { animation-delay: .24s;  height: 64px; }
.seq-bar:nth-child(4) { animation-delay: .36s;  height: 48px; }
.seq-bar:nth-child(5) { animation-delay: .48s;  height: 34px; }
@keyframes seqwave { 0%,100% { transform: scaleY(.35); opacity: .55; } 40% { transform: scaleY(1); opacity: 1; } }

/* --- Path: SVG curvy offset-path + traveller dot looping --- */
.path-svg { width: 88%; height: 88%; }
.path-line { fill: none; stroke: color-mix(in srgb, var(--p-cyan) 64%, var(--glass-ink)); stroke-width: 2.2;
    stroke-dasharray: 4 5; opacity: .7; }
.path-dot { r: 5; fill: var(--p-yellow); filter: drop-shadow(0 0 5px color-mix(in srgb, var(--p-yellow) 60%, transparent)); }

/* =====================================================================
   STAGE CHROME — name-plate + glassy arrows (theatre-light text)
   ===================================================================== */
.chrome {
    position: absolute;
    left: 50%; bottom: 7vh;
    transform: translateX(-50%);
    z-index: 6;
    display: flex; align-items: center; gap: 28px;
    opacity: 0; transition: opacity 700ms ease 200ms;
}
.chrome.active { opacity: 1; }

.arrow {
    position: relative;
    width: 60px; height: 60px;
    border-radius: 50%;
    border: 1px solid color-mix(in srgb, var(--stage-text) 30%, transparent);
    background:
        radial-gradient(120% 120% at 30% 20%, hsl(var(--warm-light)/.22), transparent 60%),
        color-mix(in srgb, hsl(var(--warm-light)) 8%, hsl(28 16% 12% / .42));
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: var(--stage-text);
    display: grid; place-items: center;
    cursor: pointer;
    box-shadow: 0 8px 24px hsl(26 24% 4% / .4), 0 0 0 0 hsl(var(--warm-light)/0);
    transition: transform 160ms cubic-bezier(.22,1,.36,1), box-shadow 240ms ease, background 240ms ease;
    overflow: hidden;
}
/* idle shimmer */
.arrow::after {
    content: ""; position: absolute; inset: -40%;
    background: linear-gradient(115deg, transparent 38%, hsl(var(--warm-core)/.5) 50%, transparent 62%);
    transform: translateX(-120%);
    animation: shimmer 4.2s ease-in-out infinite;
}
@keyframes shimmer { 0%,72% { transform: translateX(-120%); } 86%,100% { transform: translateX(120%); } }
.arrow svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2.4; fill: none; }
.arrow:hover { transform: scale(1.12); box-shadow: 0 10px 30px hsl(26 24% 4% / .5), 0 0 26px hsl(var(--warm-light)/.4); }
.arrow:active { transform: scale(.92); }

.nameplate { text-align: center; min-width: 220px; }
.nameplate .name {
    font-family: var(--font-display);
    font-size: 54px; line-height: .92;
    color: var(--stage-text);
    text-shadow: 0 2px 18px hsl(var(--warm-light)/.4), 0 1px 0 hsl(26 24% 4% / .5);
    transition: opacity 200ms ease;
}
.nameplate .meta {
    font-family: var(--font-mono);
    font-size: 12px; letter-spacing: 2px;
    color: var(--stage-text-dim);
    margin-top: 4px;
}

/* =====================================================================
   SINGLE-VIEW LANDING (FIX #6) — a single live scene, then morph to stage
   ===================================================================== */
.landing {
    position: absolute;
    inset: 0; z-index: 8;
    display: grid; place-items: center;
    transition: opacity 800ms cubic-bezier(.4,0,.2,1), transform 1000ms cubic-bezier(.22,1,.36,1), filter 800ms ease;
}
.landing.recede {
    opacity: 0;
    transform: translateZ(-160px) scale(1.08);
    filter: blur(10px);
    pointer-events: none;
}
.landing-glass {
    position: relative;
    width: min(72vw, 720px);
    height: min(58vh, 520px);
    border-radius: 26px;
    overflow: hidden;
    background:
        linear-gradient(150deg,
            color-mix(in srgb, var(--glass-tint) 60%, transparent),
            color-mix(in srgb, var(--glass-tint) 38%, transparent));
    backdrop-filter: blur(10px) saturate(120%); -webkit-backdrop-filter: blur(10px) saturate(120%);
    border: 1px solid color-mix(in srgb, var(--glass-ink) 16%, transparent);
    box-shadow: 0 1px 0 color-mix(in srgb,white 26%,transparent) inset, 0 30px 80px hsl(26 24% 4% / .4);
}
.landing-stage { position: absolute; inset: 0; }
.landing-stage .cube-scene { width: 100%; height: 100%; perspective: 700px; }
.landing-stage .cube { width: 150px; height: 150px; animation-duration: 18s; }
.landing-stage .cube .f { width: 150px; height: 150px; font-size: 52px; }
.landing-stage .cube .f1 { transform: translateZ(75px); }
.landing-stage .cube .f2 { transform: rotateY(90deg) translateZ(75px); }
.landing-stage .cube .f3 { transform: rotateY(180deg) translateZ(75px); }
.landing-stage .cube .f4 { transform: rotateY(-90deg) translateZ(75px); }
.landing-stage .cube .f5 { transform: rotateX(90deg) translateZ(75px); }
.landing-stage .cube .f6 { transform: rotateX(-90deg) translateZ(75px); }

.landing-caption {
    position: absolute; left: 28px; top: 24px; z-index: 2;
}
.landing-caption .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 3px;
    text-transform: uppercase; color: color-mix(in srgb, var(--glass-ink) 60%, transparent); }
.landing-caption .title { font-family: var(--font-display); font-size: 56px; line-height: .9; color: var(--glass-ink); margin-top: 2px; }

.switch-btn {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    z-index: 3;
    font-family: var(--font-mono); font-size: 13px; letter-spacing: 1.5px;
    padding: 12px 26px; border-radius: 999px;
    color: var(--glass-ink);
    background:
        radial-gradient(120% 120% at 30% 20%, color-mix(in srgb,white 24%,transparent), transparent 60%),
        color-mix(in srgb, var(--glass-tint) 50%, transparent);
    border: 1px solid color-mix(in srgb, var(--glass-ink) 20%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    cursor: pointer;
    box-shadow: 0 8px 24px hsl(26 24% 4% / .3);
    transition: transform 160ms cubic-bezier(.22,1,.36,1), box-shadow 240ms ease;
}
.switch-btn:hover { transform: translateX(-50%) scale(1.05); box-shadow: 0 10px 30px hsl(26 24% 4% / .4), 0 0 22px hsl(var(--warm-light)/.35); }
.switch-btn:active { transform: translateX(-50%) scale(.96); }

/* =====================================================================
   TOP-RIGHT controls (theme / PRM / back)
   ===================================================================== */
.controls {
    position: absolute; right: 18px; top: 16px; z-index: 12;
    display: flex; gap: 8px;
}
.ctl {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .5px;
    padding: 8px 12px; border-radius: 10px;
    color: var(--foreground);
    background: color-mix(in srgb, var(--glass-tint) 50%, transparent);
    border: 1px solid color-mix(in srgb, var(--glass-ink) 16%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    cursor: pointer; user-select: none;
    transition: transform 140ms ease, background 200ms ease;
}
.ctl:hover { transform: translateY(-1px); }
.ctl[aria-pressed="true"] { background: color-mix(in srgb, hsl(var(--warm-light)) 26%, transparent); color: hsl(26 30% 12%); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* reduced-motion path: freeze the light + kill drift/shimmer */
.prm .beam-wrap, .prm .motes, .prm .arrow::after { animation: none !important; }
.prm .beam-source, .prm .paper-pool, .prm .cone, .prm .beam-bloom { transition: none !important; }
.prm .cube, .prm .boing, .prm .boing-wrap, .prm .sq, .prm .seq-bar,
.prm .spring-needle, .prm .path-dot, .prm .ease-ball { animation: none !important; }
@media (prefers-reduced-motion: reduce) {
    .beam-wrap, .motes, .arrow::after,
    .cube, .boing, .boing-wrap, .sq, .seq-bar, .spring-needle, .ease-ball { animation: none !important; }
}
</style>
</head>
<body>
<div id="app">

    <!-- grid-paper substrate (FIX #5) -->
    <div class="grid-paper" id="gridPaper"></div>
    <div class="paper-pool" id="paperPool"></div>
    <div class="paper-vignette" id="paperVignette"></div>

    <!-- the volumetric god-ray (FIX C / #7) -->
    <div class="beam-wrap" id="beam">
        <div class="beam-source"></div>
        <div class="cone cone-1"></div>
        <div class="cone cone-2"></div>
        <div class="cone cone-3"></div>
        <div class="motes" id="motes"></div>
        <div class="beam-bloom"></div>
    </div>

    <!-- the turntable stage (FIX #1 / #3) -->
    <div class="stage" id="stage" aria-hidden="true">
        <div class="turntable">
            <div class="platter"></div>
            <div class="ring" id="ring"></div>
        </div>
    </div>

    <!-- stage chrome: arrows + name-plate -->
    <div class="chrome" id="chrome" role="group" aria-label="Scene navigation">
        <button class="arrow" id="prev" aria-label="Previous scene">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="nameplate">
            <div class="name" id="plateName">Cube</div>
            <div class="meta" id="plateMeta">1 / 7</div>
        </div>
        <button class="arrow" id="next" aria-label="Next scene">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
    </div>

    <!-- single-view landing (FIX #6) -->
    <div class="landing" id="landing">
        <div class="landing-glass">
            <div class="landing-stage">
                <div class="cube-scene">
                    <div class="pv"><div class="cube">
                        <div class="f f1">1</div><div class="f f2">2</div><div class="f f3">3</div>
                        <div class="f f4">4</div><div class="f f5">5</div><div class="f f6">6</div>
                    </div></div>
                </div>
            </div>
            <div class="landing-caption">
                <div class="eyebrow">keyframes.js · demo</div>
                <div class="title">Cube</div>
            </div>
            <button class="switch-btn" id="switchBtn">Switch scene&nbsp;&nbsp;→</button>
        </div>
    </div>

    <!-- controls -->
    <div class="controls">
        <button class="ctl" id="backBtn" hidden>← Single view</button>
        <button class="ctl" id="themeBtn">◐ Light</button>
        <button class="ctl" id="prmBtn" aria-pressed="false">PRM</button>
    </div>

    <div class="sr-only" id="liveRegion" role="status" aria-live="polite"></div>
</div>

<script type="module">
/* =====================================================================
   STATE + DATA
   ===================================================================== */
const SCENES = [
    { name: "Cube",     build: cubePreview     },
    { name: "Amiga",    build: amigaPreview    },
    { name: "Square",   build: squarePreview   },
    { name: "Easing",   build: easingPreview   },
    { name: "Spring",   build: springPreview   },
    { name: "Sequence", build: sequencePreview },
    { name: "Path",     build: pathPreview     },
];
const N = SCENES.length;

const ring   = document.getElementById("ring");
const stage  = document.getElementById("stage");
const chrome = document.getElementById("chrome");
const beam   = document.getElementById("beam");
const landing= document.getElementById("landing");
const app    = document.getElementById("app");
const live   = document.getElementById("liveRegion");

const plateName = document.getElementById("plateName");
const plateMeta = document.getElementById("plateMeta");

let active = 0;          // logical selected index
let prm = false;         // reduced motion
let onStage = false;

/* the spring carousel position — `pos` is a continuous angle index that the
   spring drives toward `target`. Shortest signed delta, interruptible.
   The REAL impl uses @mkbabb/keyframes.js SpringProgress (LIGHT barrel) on
   RAFPlayback; this inline critically-damped step matches its closed form. */
let pos = 0, vel = 0, target = 0;
const STIFF = 150, DAMP = 24;     // critically-damped-ish; smooth + quick

/* light-pool tracking — slides toward hovered / front card */
let poolX = 50, poolXTarget = 50, poolVel = 0;
let energy = 1;                   // breathing intensity

/* =====================================================================
   PREVIEW BUILDERS — return innerHTML for each card-stage
   ===================================================================== */
function cubePreview() {
    return `<div class="pv cube-scene"><div class="cube">
        <div class="f f1">1</div><div class="f f2">2</div><div class="f f3">3</div>
        <div class="f f4">4</div><div class="f f5">5</div><div class="f f6">6</div>
    </div></div>`;
}
function amigaPreview() {
    return `<div class="pv">
        <div class="amiga-floor"></div>
        <div class="boing-wrap"><div class="boing"></div></div>
    </div>`;
}
function squarePreview() {
    return `<div class="pv"><div class="sq">drag&nbsp;me</div></div>`;
}
function easingPreview() {
    return `<div class="pv"><svg class="ease-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <line class="ease-grid" x1="0" y1="100" x2="100" y2="100"/>
        <line class="ease-grid" x1="0" y1="0" x2="0" y2="100"/>
        <path class="ease-trace" d="M0,100 C40,100 60,0 100,0"/>
        <path class="ease-curve" d="M0,100 C40,100 60,0 100,0"/>
        <circle class="ease-ball" r="4">
            <animateMotion dur="2.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1"
                calcMode="spline" keySplines="0.65 0 0.35 1" path="M0,100 C40,100 60,0 100,0"/>
        </circle>
    </svg></div>`;
}
function springPreview() {
    return `<div class="pv">
        <div class="spring-rail"></div>
        <div class="spring-target"></div>
        <div class="spring-needle"></div>
    </div>`;
}
function sequencePreview() {
    return `<div class="pv"><div class="seq">
        <div class="seq-bar"></div><div class="seq-bar"></div><div class="seq-bar"></div>
        <div class="seq-bar"></div><div class="seq-bar"></div>
    </div></div>`;
}
function pathPreview() {
    const d = "M10,78 C18,30 44,18 54,44 C62,64 84,66 90,28";
    return `<div class="pv"><svg class="path-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path class="path-line" d="${d}"/>
        <circle class="path-dot">
            <animateMotion dur="4s" repeatCount="indefinite" path="${d}" rotate="auto"
                calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
        </circle>
    </svg></div>`;
}

/* =====================================================================
   BUILD THE RING CARDS
   ===================================================================== */
const cards = SCENES.map((scene, i) => {
    const el = document.createElement("div");
    el.className = "card";
    el.setAttribute("role", "button");
    el.setAttribute("tabindex", "-1");
    el.setAttribute("aria-label", `${scene.name}, scene ${i + 1} of ${N}`);
    el.innerHTML = `
        <div class="card-stage">${scene.build()}</div>
        <div class="card-label">
            <span class="card-name">${scene.name}</span>
            <span class="card-idx">${i + 1}/${N}</span>
        </div>`;
    el.addEventListener("click", () => selectIndex(i));
    el.addEventListener("mouseenter", () => hoverTo(i));
    el.addEventListener("mouseleave", () => hoverTo(null));
    ring.appendChild(el);
    return el;
});

/* =====================================================================
   DUST MOTES — sprinkle a handful of drifting particles inside the cone
   ===================================================================== */
(function seedMotes() {
    const host = document.getElementById("motes");
    for (let i = 0; i < 26; i++) {
        const m = document.createElement("div");
        m.className = "mote";
        const size = 1 + Math.random() * 2.6;
        const x = 38 + Math.random() * 24;        // cluster within the cone
        const y = 6 + Math.random() * 78;
        m.style.width = m.style.height = size + "px";
        m.style.left = x + "%";
        m.style.top = y + "%";
        m.style.setProperty("--mx", (Math.random() * 28 - 14) + "px");
        m.style.animationDuration = (7 + Math.random() * 8) + "s";
        m.style.animationDelay = (-Math.random() * 10) + "s";
        host.appendChild(m);
    }
})();

/* =====================================================================
   RING LAYOUT — per-frame 3D placement (FIX #1, #8)
   Cards sit on a circle; we compute each card's offset from the smooth
   `pos`, then place it with translate3d (real Z depth) + scale + opacity
   + brightness. Minimal blur (max ~1px on the far rear). NO heavy blur.
   ===================================================================== */
const RADIUS = 360;       // ring radius in px (in the tilted plane)

function layout() {
    const frontIdx = ((Math.round(pos) % N) + N) % N;

    for (let i = 0; i < N; i++) {
        // signed shortest offset of card i from the continuous pos
        let off = i - pos;
        off = ((off + N / 2) % N + N) % N - N / 2;   // wrap to [-N/2, N/2)

        const a = off * (Math.PI * 2 / N);           // angle on the ring
        const z = Math.cos(a) * RADIUS;              // depth (front = +)
        const x = Math.sin(a) * RADIUS * 1.18;       // horizontal spread
        const depth01 = (z / RADIUS + 1) / 2;        // 0 (rear) .. 1 (front)

        // FIX #4 + E — LIFTED darks: rear stays clearly visible.
        const scale = 0.62 + depth01 * 0.42;
        const opacity = 0.5 + depth01 * 0.5;         // never 0 — rear still reads
        const bright = 0.78 + depth01 * 0.30;        // depth via brightness, not black
        const blur = (1 - depth01) * 1.0;            // 0px front .. 1px rear (minimal)
        const liftZ = (depth01 - 0.5) * 80;          // pop the front toward viewer

        const el = cards[i];
        el.style.transform =
            `translate3d(${x}px, 0px, ${z + liftZ - RADIUS}px) scale(${scale.toFixed(3)})`;
        el.style.opacity = opacity.toFixed(3);
        el.style.filter = `brightness(${bright.toFixed(3)}) blur(${blur.toFixed(2)}px)`;
        el.style.zIndex = String(Math.round(depth01 * 100));
        el.classList.toggle("front", i === frontIdx);
        el.setAttribute("aria-current", i === frontIdx ? "true" : "false");
    }

    plateName.textContent = SCENES[frontIdx].name;
    plateMeta.textContent = `${frontIdx + 1} / ${N}`;
}

/* =====================================================================
   THE SINGLE rAF LOOP (FIX #7, #8) — drives:
     · the critically-damped carousel spring (pos → target)
     · the light-pool slide (poolX → poolXTarget)
     · the breathing light energy
   Correct dt every frame. One loop. No nested rAF.
   ===================================================================== */
let last = performance.now();

function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;     // clamp big gaps (tab switches)

    if (prm) {
        pos = target;
        poolX = poolXTarget;
        energy = 1;
        vel = 0; poolVel = 0;
    } else {
        // critically-damped spring step (semi-implicit Euler) for pos
        const accel = -STIFF * (pos - target) - DAMP * vel;
        vel += accel * dt;
        pos += vel * dt;

        // light pool slide (softer spring)
        const pAccel = -90 * (poolX - poolXTarget) - 18 * poolVel;
        poolVel += pAccel * dt;
        poolX += poolVel * dt;

        // breathing energy — gentle sine, never crushes below ~0.9
        energy = 0.96 + 0.08 * Math.sin(now / 1300);
    }

    app.style.setProperty("--light-energy", energy.toFixed(3));
    const poolPct = poolX.toFixed(2) + "%";
    document.getElementById("paperPool").style.setProperty("--pool-x", poolPct);
    document.getElementById("paperVignette").style.setProperty("--pool-x", poolPct);
    beam.style.setProperty("--beam-x", poolPct);

    if (onStage) layout();

    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* =====================================================================
   NAVIGATION
   ===================================================================== */
function setTarget(idx) {
    // shortest signed path: pick a target near `pos` so the spring takes the
    // short way around the ring (interruptible — re-call mid-flight is fine).
    active = ((idx % N) + N) % N;
    let t = active;
    while (t - pos > N / 2)  t -= N;
    while (t - pos < -N / 2) t += N;
    target = t;
    poolXTarget = 50;     // recentre the light on the soon-to-be front card
    announce(`${SCENES[active].name}, scene ${active + 1} of ${N}`);
}
function selectIndex(i) { setTarget(i); }
function step(dir) { setTarget(active + dir); }

function hoverTo(i) {
    if (i === null) { poolXTarget = 50; return; }
    // slide light toward the hovered flank's screen x (FIX #7)
    let off = i - pos;
    off = ((off + N / 2) % N + N) % N - N / 2;
    const a = off * (Math.PI * 2 / N);
    const screenX = 50 + Math.sin(a) * 26;     // ring angle → screen %
    poolXTarget = Math.max(20, Math.min(80, screenX));
}

function commit() {
    const frontIdx = ((Math.round(pos) % N) + N) % N;
    console.log(`[Stage] committed scene: ${SCENES[frontIdx].name} (#${frontIdx + 1})`);
    announce(`Entering ${SCENES[frontIdx].name}`);
    stage.style.transition = "opacity 500ms ease, filter 500ms ease";
    stage.style.opacity = "0.0";
    stage.style.filter = "blur(8px)";
    setTimeout(() => {
        stage.style.opacity = "1";
        stage.style.filter = "blur(0)";
    }, 560);
}

function announce(msg) { live.textContent = msg; }

/* =====================================================================
   ENTER / EXIT — the liquid-glass morph (FIX #6)
   ===================================================================== */
function enterStage() {
    if (onStage) return;
    onStage = true;
    landing.classList.add("recede");
    beam.classList.add("lit");
    setTimeout(() => {
        stage.classList.add("active");
        stage.setAttribute("aria-hidden", "false");
        chrome.classList.add("active");
        document.getElementById("backBtn").hidden = false;
        cards.forEach(c => c.setAttribute("tabindex", "0"));
        cards[active]?.focus({ preventScroll: true });
    }, 220);   // let the single-view begin receding, then bloom the stage in
    setTarget(active);
}
function exitStage() {
    if (!onStage) return;
    onStage = false;
    stage.classList.remove("active");
    stage.setAttribute("aria-hidden", "true");
    chrome.classList.remove("active");
    beam.classList.remove("lit");
    landing.classList.remove("recede");
    document.getElementById("backBtn").hidden = true;
    cards.forEach(c => c.setAttribute("tabindex", "-1"));
}

/* =====================================================================
   WIRING
   ===================================================================== */
document.getElementById("switchBtn").addEventListener("click", enterStage);
document.getElementById("backBtn").addEventListener("click", exitStage);
document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(+1));

document.getElementById("themeBtn").addEventListener("click", (e) => {
    const isDark = document.documentElement.classList.toggle("dark");
    e.currentTarget.textContent = isDark ? "◐ Light" : "◑ Dark";
});

document.getElementById("prmBtn").addEventListener("click", (e) => {
    prm = !prm;
    app.classList.toggle("prm", prm);
    e.currentTarget.setAttribute("aria-pressed", String(prm));
    announce(prm ? "Reduced motion on" : "Reduced motion off");
});

// keyboard: Arrow / Home / End, Enter commits, Esc exits
window.addEventListener("keydown", (e) => {
    if (!onStage) return;
    switch (e.key) {
        case "ArrowRight": case "ArrowDown": e.preventDefault(); step(+1); break;
        case "ArrowLeft":  case "ArrowUp":   e.preventDefault(); step(-1); break;
        case "Home":  e.preventDefault(); setTarget(0); break;
        case "End":   e.preventDefault(); setTarget(N - 1); break;
        case "Enter": e.preventDefault(); commit(); break;
        case "Escape": e.preventDefault(); exitStage(); break;
    }
});

// respect the OS reduced-motion preference at load
if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    prm = true; app.classList.add("prm");
    document.getElementById("prmBtn").setAttribute("aria-pressed", "true");
}

// initial layout pass so cards are placed even before entering
pos = 0; target = 0;
layout();

// test hook for the screenshot harness
window.__stage = {
    enter: enterStage, exit: exitStage,
    step, setTarget, hoverTo, commit,
    setPRM(v){ prm = v; app.classList.toggle("prm", v); document.getElementById("prmBtn").setAttribute("aria-pressed", String(v)); },
    setTheme(d){ document.documentElement.classList.toggle("dark", d); document.getElementById("themeBtn").textContent = d ? "◐ Light" : "◑ Dark"; },
    get state(){ return { onStage, active, pos: +pos.toFixed(3), target, poolX: +poolX.toFixed(2) }; }
};
</script>
</body>
</html>
