<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The favicon (J.W7a S3 / D15 / CP-4.1) — the COLOURFUL cube promoted to
       browser chrome: a simplified 3-face flat-colour M. Cubert (top magenta,
       left yellow, right red — the exact face hues of the nav cube glyph's
       raster, cube.svg) that survives 16px. Replaces the monochrome line-art
       cube IN THE SAME MOTION (no legacy beside the replacement): the brand's
       most-seen image now carries the brand's most-seen colour on the
       most-seen surface — the tab. Flat fills read on light AND dark tab
       strips, so the former prefers-color-scheme stroke swap retires with the
       strokes. Geometry is the H.W5 vector cube's own hexagon. -->
  <path d="M16 3 28 9.5 16 16 4 9.5Z" fill="#ff00ff"/>
  <path d="M4 9.5 16 16 16 29 4 22.5Z" fill="#ffff00"/>
  <path d="M16 16 28 9.5 28 22.5 16 29Z" fill="#ff0000"/>
