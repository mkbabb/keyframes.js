<!doctype html>
<!-- The embed entry: one slice of the demo for an allow-listed host
     (`/embed/#/cube?skin=…&scheme=…`; ./bridge.ts). Its own document, so its
     response headers are its own (public/_headers `/embed/*`). -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex" />
        <title>Cube</title>
        <!-- The host's scheme, stamped before first paint: `scheme` in the hash,
             else the platform's. `color-scheme` must equal the host's, or the
             browser backs a transparent frame with an opaque canvas. -->
        <script>
            (function () {
                var m = /[?&]scheme=(dark|light)\b/.exec(location.hash);
                var dark = m ? m[1] === "dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
                var e = document.documentElement;
                e.classList.toggle("dark", dark);
                e.style.colorScheme = dark ? "dark" : "light";
            })();
        </script>
        <style>
            html, body { background: transparent; margin: 0; }
        </style>
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <div id="app"></div>
    </body>
</html>
