<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <!-- X.KF.W13X.mobile (A2-KE-L2-15) — `viewport-fit=cover`: the page is
             laid out edge to edge and the safe area is the CSS's to honour. The
             layout's arithmetic has always read env(safe-area-inset-*) (the dock
             anchors and bands, layout.css; TransportDock's bottom padding; the
             page and hero gutters for a landscape notch), but without the opt-in
             iOS resolves every env() to 0 and every one of those terms was dead. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <!-- I.W5.S4 (K): the tab title is single-sourced HERE — exactly
             `keyframes.js`, no build-time rewrite. The gh-pages build copies this
             index.html verbatim, so the SOURCE *is* the shipped title (the prior
             source-vs-build drift — long here, short in a stale demo/app/dist/ —
             is the same single-source family as B9; proof:demo-title asserts the
             rendered document.title equals exactly "keyframes.js"). The longer
             descriptive copy lives in the <meta name="description"> below. -->
        <title>keyframes.js</title>
        <meta
            name="description"
            content="keyframes.js parses CSS @keyframes and animates any object or DOM element in JavaScript — springs, scroll timelines, element morphs, and a live editor demo."
        />
        <meta name="robots" content="index, follow" />
        <link rel="canonical" href="https://mkbabb.github.io/keyframes.js/" />
        <!-- BLK-7: the favicon re-pointed from the KILLed cube-icon-sm.png to the
             checked-in vector favicon in the SAME motion as the PNG KILL (one
             vector idiom for nav AND chrome; rel=icon resolves, no 404).
             J.W7a S3 (D15 / CP-4.1): that vector is now the COLOURFUL 3-face
             cube (favicon.svg re-authored — magenta/yellow/red, the nav cube's
             own face hues) so the brand's signature image reaches browser
             chrome; the tab strip + Android toolbar take the cube's magenta
             via theme-color, and iOS homescreens get the same cube via the
             checked-in 180px apple-touch-icon (public/, copied to the build
             root — PNG because iOS ignores SVG touch icons).
             UIA-KF-227 (X.KF.W13V.u): the favicon lives in the SAME public dir as
             the touch icon. Its old href climbed out of the Vite root
             (`../../assets/icons/`), which the build rewrote but the dev server
             served verbatim — `/assets/icons/favicon.svg` 404'd on every dev load. -->
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <meta name="theme-color" content="#ff00ff" />
        <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

        <!-- The hero <h1 class="text-display-4"> (EditorStartScreen.vue) is the
             LCP element, set in Instrument Serif roman (--font-display). Its
             face is self-hosted (./fonts, declared in style.css) and is
             found only once the stylesheet is parsed, so the head preloads it:
             the one above-the-fold face, latin subset. `crossorigin` is
             mandatory (a font fetch is CORS-anonymous; a preload without it
             fetches twice). -->
        <link
            rel="preload"
            as="font"
            type="font/woff2"
            href="./fonts/instrument-serif-latin-400-normal.woff2"
            crossorigin
        />

        <!-- Sync dark mode class before first paint to prevent FOUC on Safari -->
        <script>
            (function() {
                var s = localStorage.getItem('vueuse-color-scheme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var dark = s === 'dark' || (s !== 'light' && (s === 'auto' || s == null) && prefersDark);
                if (dark) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.style.colorScheme = 'dark';
                }
            })();
        </script>
        <!-- The app bootstrap is a real module file (a graph ROOT rolldown
             must keep), never an inline module (a graph LEAF it may — and
             once did — tree-shake into a blank production build). -->
        <script type="module" src="./main.ts"></script>
    </head>

    <body>
        <!-- No splash: criticalCSSPlugin inlines the themed background +
             body geometry for an instant, layout-stable first paint, and
             the app's true first frame (the hero) mounts directly onto it —
             nothing to content-swap. -->
        <div id="app"></div>
    </body>
</html>
