<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>keyframes.js — CSS keyframe animations for anything in JavaScript</title>
        <meta
            name="description"
            content="keyframes.js parses CSS @keyframes and animates any object or DOM element in JavaScript — springs, scroll timelines, element morphs, and a live editor demo."
        />
        <meta name="robots" content="index, follow" />
        <link rel="canonical" href="https://mkbabb.github.io/keyframes.js/" />
        <link rel="icon" href="../../assets/icons/cube-icon-sm.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <!-- Fira Code arrives self-hosted via @mkbabb/glass-ui/styles cascade.
             Instrument Serif remains Google-Fonts-loaded (not in glass-ui font subsystem).
             Non-blocking pattern: media="print" prevents render-block, onload swaps to "all". -->
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
            media="print"
            onload="this.media='all'"
        />
        <noscript>
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" />
        </noscript>

        <!-- Sync dark mode class before first paint to prevent FOUC on Safari -->
        <script>
            (function() {
                var s = localStorage.getItem('vueuse-color-scheme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var dark = s === 'dark' || (s !== 'light' && (s === 'auto' || s == null) && prefersDark);
                if (dark) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.style.colorScheme = 'dark';
                }
            })();
        </script>
        <!-- The app bootstrap is a real module file (a graph ROOT rolldown
             must keep), never an inline module (a graph LEAF it may — and
             once did — tree-shake into a blank production build). -->
        <script type="module" src="./main.ts"></script>
    </head>

    <body>
        <!-- No splash: criticalCSSPlugin inlines the themed background +
             body geometry for an instant, layout-stable first paint, and
             the app's true first frame (the hero) mounts directly onto it —
             nothing to content-swap. -->
        <div id="app"></div>
    </body>
</html>
