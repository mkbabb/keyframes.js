<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- I.W5.S4 (K): the tab title is single-sourced HERE — exactly
             `keyframes.js`, no build-time rewrite. The gh-pages build copies this
             index.html verbatim, so the SOURCE *is* the shipped title (the prior
             source-vs-build drift — long here, short in a stale demo/app/dist/ —
             is the same single-source family as B9; proof:demo-title asserts the
             rendered document.title equals exactly "keyframes.js"). The longer
             descriptive copy lives in the <meta name="description"> below. -->
        <title>keyframes.js</title>
        <meta
            name="description"
            content="keyframes.js parses CSS @keyframes and animates any object or DOM element in JavaScript — springs, scroll timelines, element morphs, and a live editor demo."
        />
        <meta name="robots" content="index, follow" />
        <link rel="canonical" href="https://mkbabb.github.io/keyframes.js/" />
        <!-- BLK-7: the favicon re-pointed from the KILLed cube-icon-sm.png to the
             checked-in vector favicon in the SAME motion as the PNG KILL (one
             vector idiom for nav AND chrome; rel=icon resolves, no 404).
             J.W7a S3 (D15 / CP-4.1): that vector is now the COLOURFUL 3-face
             cube (favicon.svg re-authored — magenta/yellow/red, the nav cube's
             own face hues) so the brand's signature image reaches browser
             chrome; the tab strip + Android toolbar take the cube's magenta
             via theme-color, and iOS homescreens get the same cube via the
             checked-in 180px apple-touch-icon (public/, copied to the build
             root — PNG because iOS ignores SVG touch icons). -->
        <link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg" />
        <meta name="theme-color" content="#ff00ff" />
        <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <!-- C4 font preload (E.W4 S4): the hero <h1 class="text-display-4">
             (EditorStartScreen.vue) is the LCP element, set in Instrument Serif
             REGULAR (--font-display). The non-blocking stylesheet below discovers
             the woff2 only after the print-media CSS loads + the onload swap, so
             the LCP face arrives late and swaps from the metric-matched fallback
             mid-paint. Preloading the EXACT above-the-fold face — Instrument
             Serif upright, latin subset (the heading "Select an animation…" is
             upright latin) — starts that fetch in the head, in parallel with the
             stylesheet, so the web font is on-disk by the time the swap fires.
             ONE face only (the guide forbids over-preloading: italic + latin-ext
             are not above the fold). `crossorigin` is mandatory — a font fetch is
             always CORS-anonymous, and a preload without it double-fetches. The
             URL is the gstatic v5 latin woff2 the css2 endpoint serves modern
             Chromium; if Google bumps the family version it serves the old file
             indefinitely (the stylesheet remains the source of truth — a stale
             preload simply misses the cache, never 404s the render). -->
        <link
            rel="preload"
            as="font"
            type="font/woff2"
            href="https://fonts.gstatic.com/s/instrumentserif/v5/jizHRFtNs2ka5fXjeivQ4LroWlx-6zAjjH7Motmp5g.woff2"
            crossorigin
        />

        <!-- Fira Code arrives self-hosted via @mkbabb/glass-ui/styles cascade.
             Instrument Serif remains Google-Fonts-loaded (not in glass-ui font subsystem).
             Non-blocking pattern: media="print" prevents render-block, onload swaps to "all". -->
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
            media="print"
            onload="this.media='all'"
        />
        <noscript>
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" />
        </noscript>

        <!-- Sync dark mode class before first paint to prevent FOUC on Safari -->
        <script>
            (function() {
                var s = localStorage.getItem('vueuse-color-scheme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var dark = s === 'dark' || (s !== 'light' && (s === 'auto' || s == null) && prefersDark);
                if (dark) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.style.colorScheme = 'dark';
                }
            })();
        </script>
        <!-- The app bootstrap is a real module file (a graph ROOT rolldown
             must keep), never an inline module (a graph LEAF it may — and
             once did — tree-shake into a blank production build). -->
        <script type="module" src="./main.ts"></script>
    </head>

    <body>
        <!-- No splash: criticalCSSPlugin inlines the themed background +
             body geometry for an instant, layout-stable first paint, and
             the app's true first frame (the hero) mounts directly onto it —
             nothing to content-swap. -->
        <div id="app"></div>
    </body>
</html>
