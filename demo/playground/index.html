<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Playground — keyframes.js</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Fira Code arrives self-hosted via @mkbabb/glass-ui/styles cascade. -->
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
            media="print"
            onload="this.media='all'"
        />
        <noscript>
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" />
        </noscript>

        <script type="module">
            import { createApp } from "vue";
            import App from "./App.vue";
            // L.W8 S1 ED-3 DOGFOOD INVERSION — warm the published kf engine
            // surface (loadAnimationEngine()) before mount so the playground's
            // synchronous heavy construction (AnimationGroup + presets) reads it
            // via kfEngine(). The heavy graph still rides the dynamic boundary.
            import { warmKfEngine } from "../@/utils/kfEngine";

            const app = createApp(App);
            void warmKfEngine().finally(() => {
                app.mount("#app");
            });
        </script>
    </head>

    <body>
        <div style="display: contents" id="app"></div>
    </body>
</html>
