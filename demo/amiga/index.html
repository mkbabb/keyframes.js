<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Amiga Demo</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Fira Code arrives self-hosted via @mkbabb/glass-ui/styles cascade. -->
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
            media="print"
            onload="this.media='all'"
        />
        <noscript>
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" />
        </noscript>

        <script>
            (function() {
                var s = localStorage.getItem('vueuse-color-scheme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var dark = s === 'dark' || (s !== 'light' && (s === 'auto' || s == null) && prefersDark);
                if (dark) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.style.colorScheme = 'dark';
                }
            })();
        </script>
        <script type="module">
            import { createApp } from "vue";
            import App from "./App.vue";

            const app = createApp(App);
            app.mount("#app");
        </script>
    </head>

    <body>
        <div style="display: contents" id="app"></div>
    </body>
</html>
