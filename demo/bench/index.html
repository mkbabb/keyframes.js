<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>keyframes.js — Performance Benchmarks</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            padding: 2rem;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        h2 { font-size: 1rem; color: #a3a3a3; margin-bottom: 1.5rem; }
        #bench-status {
            font-family: 'Fira Code', monospace;
            color: #3b82f6;
            margin-bottom: 1rem;
            min-height: 1.5em;
        }
        #bench-container {
            position: relative;
            width: 100%;
            height: 100px;
            background: #171717;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
        }
        th, td {
            padding: 0.5rem 0.75rem;
            text-align: right;
            border-bottom: 1px solid #262626;
        }
        th { color: #a3a3a3; font-weight: 500; text-align: right; }
        td:first-child, th:first-child { text-align: left; }
        td:nth-child(2), th:nth-child(2) { text-align: left; }
        tr:hover td { background: #1a1a2e; }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 1.5rem;
        }
        button:hover { background: #2563eb; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>keyframes.js Performance Benchmarks</h1>
    <h2>CSS @keyframes vs WAAPI vs keyframes.js (rAF)</h2>

    <button id="run-btn" onclick="startBenchmarks()">Run Benchmarks</button>

    <div id="bench-status">Ready. Click "Run Benchmarks" to start.</div>
    <div id="bench-container"></div>
    <div id="bench-results"></div>

    <script type="module">
        import { runBenchmarks } from './runner.ts';

        window.startBenchmarks = async () => {
            const btn = document.getElementById('run-btn');
            btn.disabled = true;
            try {
                await runBenchmarks();
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
