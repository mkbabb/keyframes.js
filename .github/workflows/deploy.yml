# deploy — build the demo (gh-pages mode) and publish it to the `gh-pages`
# branch, which GitHub Pages serves at https://keyframes.babb.dev/ (legacy
# branch source `gh-pages`, path `/`, custom domain via the root CNAME).
#
# Runs on push to master, AFTER the `ci` workflow's gates — Pages only ever
# serves a build that passed the library + demo gates. The demo legitimately
# needs glass-ui (the library does not), so this mirrors ci.yml's demo-smoke
# job: check out + build the PINNED glass-ui sibling the `file:../glass-ui`
# optional dep points at, then build the demo against it.
#
# The publish uses peaceiris/actions-gh-pages (the established mechanism — the
# `gh-pages` branch's history carries its `deploy: <sha>` commits). The root
# CNAME is carried into the published tree so the custom domain holds.
name: deploy

on:
    push:
        branches: [master]
    workflow_dispatch: {}

# Allow one concurrent deploy; let an in-progress run finish.
concurrency:
    group: pages-deploy
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - name: check out + build the glass-ui sibling (file:../glass-ui, pinned)
              run: |
                  git clone --depth 1 --branch v3.2.0 https://github.com/mkbabb/glass-ui.git "$GITHUB_WORKSPACE/../glass-ui"
                  cd "$GITHUB_WORKSPACE/../glass-ui"
                  npm ci
                  npm run build
            - name: npm ci (picks up the built file:../glass-ui)
              run: npm ci
            - name: build the demo (gh-pages)
              run: npm run gh-pages
            - name: carry the custom-domain CNAME into the published tree
              run: cp CNAME dist/gh-pages/CNAME
            - name: publish to the gh-pages branch
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./dist/gh-pages
                  publish_branch: gh-pages
                  cname: keyframes.babb.dev
