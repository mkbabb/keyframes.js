# release — publish @mkbabb/keyframes.js to npm on a v*.*.* tag.
#
# Re-runs the LIBRARY-SCOPED release gate (check:lib → build:lib → test →
# proof:boundary) before `npm publish`. The library build is glass-ui-free
# (A inv β): `@mkbabb/glass-ui` is a PUBLISHED registry optionalDependency used
# only by the demo, so the library publish leg never reaches the demo seam.
#
# keyframes.js sits between value.js and glass-ui in the publish chain — it
# resolves @mkbabb/value.js via the registry, so value.js's tag-publish must
# land first when a coordinated bump crosses both.
#
# Provenance: `npm publish --provenance` attaches a signed build-provenance
# attestation (SLSA) generated from this workflow's OIDC identity. Requires
# `id-token: write`. Publish auth stays the NPM_TOKEN repository secret; the
# OIDC token signs the attestation, the npm token authenticates the publish.
# Runs only on tag refs.
name: release

on:
    push:
        tags:
            - "v*.*.*"

# A publish in flight must NOT be cancelled mid-`npm publish` (a half-published
# version is the exact corruption the guard prevents) — so cancel-in-progress is
# FALSE: a second concurrent run on the same tag is BLOCKED, the first runs to
# completion. The deliberate asymmetry vs ci.yml's cancel-in-progress: true.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        # F-1 (K.W5 S6): the publish sequence measured <5m warm; 15m is ~3×
        # headroom and terminates within the runner's billing epoch — closing
        # the gap the cancel-in-progress: false asymmetry leaves open (a stuck
        # npm publish is BLOCKED but never CANCELLED → it can stall 6h without
        # a ceiling). ci-cd-k.md F-1.
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"
            - run: npm ci
            - name: check (tsc --noEmit, library-scoped)
              run: npm run check:lib
            - name: build (library)
              run: npm run build:lib
            - name: test
              run: npm test -- --run
            - name: proof:boundary (value.js static/dynamic boundary gate)
              run: npm run proof:boundary
            - name: publish (with provenance)
              run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
