# Publish @mkbabb/keyframes.js to npm on a matching v*.*.* tag.
#
# The release path deliberately reuses the same compact command surface as CI:
# typecheck, build, tests, the publish-boundary bundle, and the changelog check.
# Provenance is signed through the workflow's OIDC identity.
name: release

on:
    push:
        tags:
            - "v*.*.*"

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"
            - run: npm ci
            - name: assert release tag matches package version
              run: |
                  expected="v$(node -p 'require("./package.json").version')"
                  if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
                      echo "::error::release tag ${GITHUB_REF_NAME} does not match package.json ${expected}"
                      exit 1
                  fi
                  echo "release tag ${GITHUB_REF_NAME} matches package.json"
            - name: check library types
              run: npm run check:lib
            - name: build library
              run: npm run build:lib
            - name: test library
              run: npm run test:lib
            - name: verify publish boundary
              run: npm run proof:publish
            - name: verify release changelog
              run: npm run release:changelog
            - name: publish with provenance
              run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
