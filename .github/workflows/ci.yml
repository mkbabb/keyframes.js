# Merge correctness and publish-boundary workflow for @mkbabb/keyframes.js.
#
# One job of cheap gates: types, build, the library and jsdom demo suites,
# lint, and proof:publish. No browser runs in Actions (owner order 2026-11-13):
# the browser oracles, the demo roster and Lighthouse run locally before a ship
# via `npm run preship` (scripts/preship.sh). deploy-pages ships on this
# workflow's green master push.
name: ci

on:
    pull_request:
        branches: [master]
        paths-ignore:
            - "docs/**"
            - "**/*.md"
    push:
        branches: [master]
        paths-ignore:
            - "docs/**"
            - "**/*.md"
    workflow_dispatch: {}

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    gates:
        name: library gates (library tests + proof:publish)
        runs-on: ubuntu-latest
        timeout-minutes: 10 # hang guard, not a perf bar: ~2.2x the measured step sum ~4m31s (npm ci 35s, types 22s, build 9s, correctness 56s, demo correctness 1m55s, lint 5s, proof:publish 16s); COHESION §0hg
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - name: npm ci
              run: npm ci
            # The gate: one script (package.json `ci:actions`), the same one a
            # local run calls: library types, SFC/test types + structure, the
            # library and jsdom demo suites, lint, the publish boundary.
            - name: gate (npm run ci:actions)
              run: npm run ci:actions
