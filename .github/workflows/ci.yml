    # ════════════════════════════════════════════════════════════════════════
    # S.A2 — the demo-gate SPLIT (SPEC §3 S.A2 S1). The monolithic `demo-smoke`
    # job is partitioned by TIER:
    #   demo-correctness    — BLOCKING (gates deploy). ONE report-all roster step
    #                         (scripts/run-demo-roster.mjs) runs the kf-owned
    #                         correctness+hygiene demo gates against ONE shared
    #                         chromium + ONE served dist snapshot (the S.A2 S2
    #                         net-deletion), so the job carries ZERO step-level
    #                         `continue-on-error` masking. It stays honestly RED
    #                         until the S.A0 enumerated backlog (drag-gesture→S.G3,
    #                         easing-sidebar-minimal / scene-perf-budget / icon-
    #                         paint-live→S.G2) discharges (SPEC §3 S.A2 / S.A3
    #                         timing note).
    #   demo-device-observe — OBSERVE-ONLY (job-level continue-on-error; never
    #                         gates deploy). The device-dependent measurements
    #                         (LoAF / dock-perf / lighthouse) + the born-RED
    #                         tripwire — RECORDED, not blocking. THE HARD CLAUSE
    #                         (SPEC §3 S.A2, x2-#2): only genuinely device-
    #                         dependent reds ride here; NO correctness/gate-bug red
    #                         is moved off the blocking tier.
    # The membership partition is single-sourced in scripts/demo-roster.mjs (read
    # by BOTH the roster driver and proof:ci-coverage).
    # ════════════════════════════════════════════════════════════════════════
    demo-correctness:
        name: demo correctness (inv γ paints + inv δ occlusion-free · BLOCKING · gates deploy)
        runs-on: ubuntu-latest
        # The net-deletion (one shared chromium + one served dist snapshot,
        # report-all inside the roster driver) amortises the former ~50-launch
        # surface; the 50m ceiling still BOUNDS the worst case (a real hang dies
        # far before the 6h GHA default).
        timeout-minutes: 50
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - name: npm ci (installs the registry @mkbabb/glass-ui)
              run: npm ci
            - name: install playwright (demo-gate only; --no-save keeps the lib posture)
              run: npm i --no-save @playwright/test
            - name: install chromium
              run: npx playwright install --with-deps chromium
            - name: build the demo (gh-pages)
              run: npm run gh-pages
            # THE report-all roster (S.A2 S1+S2). ONE step, NO continue-on-error:
            # the report-all is INSIDE the driver (it collects every gate's exit
            # code, classifies backlog vs unexpected reds, and exits 1 iff any red).
            # The S.A0 backlog rows are BLOCKING here (they keep the job RED until
            # S.G2/G3); an UNEXPECTED red (outside the backlog) is the S.A2 signal.
            - name: "demo-correctness roster (S.A2 — one shared chromium + one served dist · report-all · zero continue-on-error masking)"
              run: npm run demo:correctness
              env:
                  KF_REQUIRE_BROWSER: "1"
                  # The modern-web-guidance corpus is a local-dev aid (npx
                  # modern-web-guidance install) — absent on a clean runner. The
                  # gate SANCTIONS this CI escape (its own message names the env):
                  # every other proof:modern-web clause still runs + bites; only
                  # the corpus-presence clause is skipped. This restores the
                  # pre-S.A2 lane posture the roster rewrite dropped.
                  KF_MWG_OPTIONAL: "1"

    demo-device-observe:
        name: demo device-observe (LoAF / dock-perf / lighthouse · OBSERVE-ONLY · never gates deploy)
        runs-on: ubuntu-latest
        # OBSERVE-ONLY: job-level continue-on-error keeps a device-measurement miss
        # (or the born-RED peer tripwire) from failing the `ci` workflow — so the
        # deploy-of-record gates on demo-correctness ALONE (SPEC §3 S.A2 / S.A3).
        continue-on-error: true
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - name: npm ci (installs the registry @mkbabb/glass-ui)
              run: npm ci
            # bucket 3 (binary-absent → install-or-observe): lighthouse is installed
            # --no-save (keeps the lib posture) and its audits ride this observe tier.
            - name: install playwright + lighthouse (observe-gate only; --no-save)
              run: npm i --no-save @playwright/test lighthouse
            - name: install chromium
              run: npx playwright install --with-deps chromium
            - name: build the demo (gh-pages)
              run: npm run gh-pages
            # [born-RED tripwire] RECORDED, never blocking (glass-ui BB peer-widen + kf re-pin, L.W9).
            - name: "[born-RED tripwire] proof:peer-satisfied (RECORDED — the live F-2 peer-cycle)"
              continue-on-error: true
              run: npm run proof:peer-satisfied
            # bucket 2 (absolute-threshold → relative budget): the kf easing clause
            # is a same-run cube-reference relative budget; the DM-12 dock clause is
            # a NON-BLOCKING glass-ui HANDOFF (dock width-morph → glass-ui). The whole
            # gate is device-dependent → OBSERVE.
            - name: "proof:perf-frame-budget (S.A2 S6 — relative easing budget · glass-ui dock HANDOFF · observe)"
              continue-on-error: true
              run: npm run proof:perf-frame-budget
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: "proof:lighthouse-a11y (C.W1 S6 — A11y=100 + SEO ≥ 90 · observe · install-or-observe)"
              continue-on-error: true
              run: npm run proof:lighthouse-a11y
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: "proof:lighthouse-mobile (J.W4 S6 — per-scene mobile Lighthouse ceilings · observe-only-in-CI)"
              continue-on-error: true
              run: npm run proof:lighthouse-mobile
            # The LoAF >50ms-trace gate needs the LIBRARY build (dist/keyframes.js)
            # the bench page imports; build:lib runs here LAST (it empties dist/, no
            # longer disturbing the gh-pages-consuming lighthouse gates above).
            - name: build the library (dist/keyframes.js for the bench page)
              run: npm run build:lib
            # S.A0(3) exit-code decouple + S.A2 S3 KF_LOAF_COUNT DE-MAGIC: the bench
            # self-selects the runner-calibrated composite size under IN_CI (the
            # named LOAF_COMPOSITE_CI_SMOKE profile) — no magic literal in the
            # workflow. The step verdict is the gate's own GREEN metric line.
            - name: "LoAF >50ms-trace gate (observer's 2nd consumer · observe)"
              continue-on-error: true
              run: |
                  npm run bench -- --run bench/playwright.bench.ts 2>&1 | tee loaf-gate.log || true
                  if ! grep -qE 'loaf-gate.*PASS: no >[0-9]+ms' loaf-gate.log; then
                      echo "::error::LoAF gate — the GREEN metric ('loaf-gate — PASS: no >Nms …') is absent; the >50ms-trace assertion did not pass."
                      exit 1
                  fi
                  echo "LoAF gate — GREEN metric asserted (>50ms-trace clean); vitest process exit decoupled."
              env:
                  KF_REQUIRE_BROWSER: "1"
            # RECORD-ALL note: this OBSERVE job never fails the `ci` workflow
            # (job-level continue-on-error). A miss above is annotated, not blocking
            # — the declarePosture observe-only discipline at the job level.
            - name: "observe-tier note (device-dependent measurements are RECORDED, never gate deploy)"
              if: always()
              run: echo "demo-device-observe — OBSERVE-ONLY (SPEC §3 S.A2 S1); LoAF / dock-perf / lighthouse + the peer tripwire are RECORDED (any red above is annotated, non-blocking); the deploy-of-record gates on demo-correctness alone."
