# Merge correctness and publish-boundary workflow for @mkbabb/keyframes.js.
#
# U.A6 collapses the merge path to the three surviving mechanisms: the Vitest
# correctness suite and proof:publish (boundary, published surface, dependency
# floor). Browser/device observations run only on the scheduled/manual roster
# below; they never hold a library merge hostage. Glass-ui remains a registry
# optional dependency and is not cloned or edited here.
name: ci

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]
    schedule:
        - cron: "17 3 * * 1"
    workflow_dispatch: {}

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    gates:
        name: library gates (npm test + proof:publish)
        runs-on: ubuntu-latest
        timeout-minutes: 4
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - name: npm ci
              run: npm ci
            - name: check library types
              run: npm run check:lib
            - name: build library
              run: npm run build:lib
            - name: correctness suite
              run: npm test -- --run
            - name: publish boundary
              run: npm run proof:publish

    # U.A7 — the device-dependent demo roster is nightly/on-demand only. A
    # scheduled red is recorded for deploy ancestry; it does not block library
    # merges. Manual dispatch is the explicit break-glass path.
    demo-correctness:
        name: demo correctness (nightly roster)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 50
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - name: npm ci (registry glass-ui)
              run: npm ci
            - name: install playwright
              run: npm i --no-save @playwright/test
            - name: install chromium
              run: npx playwright install --with-deps chromium
            - name: build demo
              run: npm run gh-pages
            - name: demo roster (report-all)
              run: npm run demo:correctness -- --gate-timeout=600
              env:
                  KF_REQUIRE_BROWSER: "1"
                  KF_MWG_OPTIONAL: "1"
            # A successful nightly publishes the SHA consumed by deploy-pages.
            - name: record last-demo-green
              if: success()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh api --method POST "repos/${{ github.repository }}/git/refs" \
                    -f "ref=refs/tags/last-demo-green" \
                    -f "sha=${{ github.sha }}" 2>/dev/null || \
                  gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/last-demo-green" \
                    -f "sha=${{ github.sha }}" -F force=true

    demo-device-observe:
        name: demo device observe (nightly, non-blocking)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        continue-on-error: true
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - name: npm ci (registry glass-ui)
              run: npm ci
            - name: install browser observers
              run: npm i --no-save @playwright/test lighthouse
            - name: install chromium
              run: npx playwright install --with-deps chromium
            - name: build demo
              run: npm run gh-pages
            - name: peer tripwire (recorded)
              continue-on-error: true
              run: npm run proof:peer-satisfied
            - name: dock order tripwire (recorded)
              continue-on-error: true
              run: npm run proof:dock-zorder
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: lighthouse observers (recorded)
              continue-on-error: true
              run: npm run proof:lighthouse-a11y
              env:
                  KF_REQUIRE_BROWSER: "1"
