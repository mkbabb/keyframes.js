# ci — PR + push-to-master gate matrix for @mkbabb/keyframes.js.
#
# TWO gate postures, by inv β:
#
#   gates (LIBRARY) — glass-ui-FREE. Every step touches only the
#   publishable surface (`src/` → `dist/`):
#     check:lib  — tsc --noEmit -p tsconfig.lib.json   (src/ only; never demo)
#     build:lib  — vite build --mode production         (library entry; externals
#                  value.js + glass-ui; demo graph untouched)
#     test       — vitest (test/, jsdom)                (no glass-ui imports)
#     proof:boundary — bundle EVERY light barrel entry and assert 0 value.js +
#                0 static engine edge per entry, the heavy engine dynamic-only,
#                no dormant static specifier (A inv α, widened in B.W2)
#   `@mkbabb/glass-ui` is a PUBLISHED registry optionalDependency the LIBRARY
#   graph never dereferences — check:lib / build:lib / proof:boundary / test stay
#   glass-ui-free (the library externalizes it; the demo graph is untouched). The
#   G re-pin retired the former local-sibling dev link: the demo now consumes the
#   published registry package like any other dep (proof:ci-coverage forbids a
#   local-link or sibling-clone glass-ui reference in any workflow).
#
#   demo-smoke (DEMO) — the demo legitimately needs glass-ui, so this is a
#   SEPARATE job that `npm ci`-installs the published registry package + a browser
#   and asserts the BUILT gh-pages demo paints (B inv γ) and occludes nothing
#   (B inv δ). A blank/tree-shaken build or an occluded page fails CI here.
#
# Cross-repo dependency-order note: keyframes.js resolves @mkbabb/value.js
# via the npm registry (range declared in `package.json`). A breaking value.js
# publish surfaces here at the `npm ci` + build:lib step — the standard
# chore(deps) bump routes the breakage through a PR. The floor is single-sourced
# in `package.json`'s declared range, not hardcoded here (proof:ci-coverage's
# version-literal clause forbids a bare workflow literal that disagrees with it).
name: ci

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]

# Cancel superseded runs on the same ref to save minutes (the constellation
# guard — `deploy/templates/ci.yml`). The gates job is ~17 proof gates + tsc +
# build + test; demo-smoke is a Playwright + lighthouse + LoAF matrix.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    gates:
        name: library gate (glass-ui-free)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5
            # kf runs Node 24 — the newest runtime the published lib will face;
            # constellation default is 22; engines floor is >=22 (a NAMED delta,
            # not silent drift — a library should test the newest runtime).
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - run: npm ci
            - name: proof:deps-current (G.W2 — @mkbabb/* pins current · protocol-clean · realm-convergent)
              run: npm run proof:deps-current
            - name: check (tsc --noEmit, library-scoped)
              run: npm run check:lib
            - name: build (library)
              run: npm run build:lib
            - name: dts artefact is real + the 15 public runtime symbols roll up
              run: |
                  test -f dist/keyframes.d.ts
                  bytes=$(wc -c < dist/keyframes.d.ts)
                  echo "dist/keyframes.d.ts = $bytes bytes"
                  test "$bytes" -gt 10000
                  # The 15 PUBLIC runtime symbols the library ships: the 14 light
                  # barrel exports + the loadAnimationEngine dynamic accessor. Each
                  # must roll up to the dts as a PRECISE `export declare …` anchor
                  # — NOT a loose substring. The former `grep "class Animation"`
                  # matched the `Animation_2` collision-rename / `AnimationGroup` /
                  # `AnimationOptionError`, proving none of them; a dropped symbol
                  # passed green. A symbol ships either directly
                  # (`export declare class|function|const NAME…`) or, when
                  # API-Extractor must collision-rename it (`ScrollTimeline_2`), as
                  # an `export { <rename> as NAME }` aliased re-export — either proves it.
                  SYMS="NumericAnimation SmoothProgress SpringProgress springLinearStops springTimingFunction ElementMorph Timeline ScrollTimeline ManualTimeline RAFPlayback resolveEasing toEasing AnimationOptionError UnknownEasingError loadAnimationEngine"
                  missing=""
                  for sym in $SYMS; do
                    if grep -qE "^export declare (abstract class|class|function|const|enum) ${sym}[<(:; ]" dist/keyframes.d.ts \
                       || grep -qE "^export \{ [A-Za-z0-9_]+ as ${sym} \}" dist/keyframes.d.ts; then
                      :
                    else
                      missing="$missing $sym"
                    fi
                  done
                  if [ -n "$missing" ]; then
                    echo "dts MISSING public runtime symbol declaration(s):$missing"
                    exit 1
                  fi
                  echo "dts public-symbol set complete: 15/15"
            - name: test
              run: npm test -- --run
            - name: proof:boundary (value.js static/dynamic boundary gate, all light entries)
              run: npm run proof:boundary
            - name: proof:engine (D.W4 transposition source gate — tick-canon · seam · pause-honest · snap-symmetry · no-legacy)
              run: npm run proof:engine
            - name: proof:zero-alloc (AnimationGroup composite allocates 0 bytes/frame + FrameCompiler seam + snap symmetry)
              run: npm run proof:zero-alloc
            # F.W2 — the library-scoped engine/correctness gates the workflow
            # previously never ran (E's engine-correctness/standalone-zero-alloc/
            # compile-deterministic + the whole F gate cohort). Each is a vitest
            # run / node script over src/ — no demo build needed, so they ride
            # the fast library job.
            - name: proof:engine-correctness (E.W7 — five engine correctness locks)
              run: npm run proof:engine-correctness
            - name: proof:standalone-zero-alloc (E.W7 — the standalone play-loop buffer)
              run: npm run proof:standalone-zero-alloc
            - name: proof:compile-deterministic (E.W8 — byte-deterministic compile ids)
              run: npm run proof:compile-deterministic
            - name: proof:orchestration (F.W3 — stagger/FLIP/decay/Sequence behaviour locks)
              run: npm run proof:orchestration
            - name: proof:interp-fastprops (F.W4 — the dict-mode buffer fold + single-frame alias)
              run: npm run proof:interp-fastprops
            - name: proof:sync-step (F.W5 — the drive sync fast-path + the event-ordering lock)
              run: npm run proof:sync-step
            - name: proof:roundtrip-easing (F.W7 — per-keyframe + spring linear() round-trip)
              run: npm run proof:roundtrip-easing
            - name: proof:adapter-capture (F.W8 — composition capture + shorthand-applied + AST-decide)
              run: npm run proof:adapter-capture
            - name: proof:motion-path (F.W12 — CSS-native MotionPath eligibility + compositor)
              run: npm run proof:motion-path
            - name: proof:blend (G.W17 — the dead add/weighted blend leaf, element-wise)
              run: npm run proof:blend
            - name: proof:drawsvg (G.W13 — CSS-native DrawSVG, WAAPI-eligible)
              run: npm run proof:drawsvg
            - name: proof:finished (G.W13 — the .finished completion front-door)
              run: npm run proof:finished
            - name: proof:adopt-compiled (G.W19 — the adoptCompiled() engine seam)
              run: npm run proof:adopt-compiled
            - name: proof:interpolate-anything (G.W15 — value-type breadth + color fidelity)
              run: npm run proof:interpolate-anything
            - name: proof:roundtrip-fidelity (G.W16 — parse→format→reparse byte-same midpoint)
              run: npm run proof:roundtrip-fidelity
            - name: proof:orbital-rotate3d (G.W18 — the orbital rotate3d output collapse)
              run: npm run proof:orbital-rotate3d
            - name: proof:asset-store-singleton (G.W8 — useAssetManager createGlobalState identity)
              run: npm run proof:asset-store-singleton
            - name: proof:scene-raf-leak (G.W9 — the scene rAF-leak lifecycle correction)
              run: npm run proof:scene-raf-leak
            - name: proof:scene-contract-identity (H.W1 — the raw-rAF ScenePlayback round-trip + easing↔cube cross-pairs)
              run: npm run proof:scene-contract-identity
            - name: proof:group-snapshot-identity (H.W1 — the born-RED engine serialize()/hydrate() HANDOFF witness)
              run: npm run proof:group-snapshot-identity
            - name: proof:resize-tracks (G.W3 — cqw tracks a non-window container resize)
              run: npm run proof:resize-tracks
            - name: proof:cohesion (F.W11 — clamp convergence · inverted-tier · preset reachability)
              run: npm run proof:cohesion
            - name: proof:repin-witness (G.W2 — the C1 computed-endpoint memo resolves O(frames)→O(1) on kf's path)
              run: npm run proof:repin-witness
            - name: proof:bench-runs (F.W1 — the compile/interp/parser benches run, non-empty)
              run: npm run proof:bench-runs
            - name: proof:ci-coverage (F.W2 — every proof:* gate is invoked in CI)
              run: npm run proof:ci-coverage

    demo-smoke:
        name: demo gate (inv γ paints + inv δ occlusion-free)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            # The demo arm needs glass-ui (the library gate does not). It is the
            # PUBLISHED registry package (`@mkbabb/glass-ui ^3.4.0`, the G re-pin) —
            # `npm ci` installs it from the registry like any dep. No sibling clone,
            # no `file:` link (the pre-re-pin model the spine retired).
            - name: npm ci (installs the registry @mkbabb/glass-ui)
              run: npm ci
            - name: install playwright + lighthouse (demo-gate only; --no-save keeps the lib posture)
              run: npm i --no-save @playwright/test lighthouse
            - name: install chromium
              run: npx playwright install --with-deps chromium
            - name: build the demo (gh-pages)
              run: npm run gh-pages
            - name: inv γ — the demo cannot ship blank
              run: node scripts/demo-smoke.mjs
            - name: inv δ — no page occludes on any viewport
              run: node scripts/occlusion-gate.mjs
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: proof:demo-usability (G.W11 — Discrete route reachable · hero word-gap · unique Play aria)
              run: npm run proof:demo-usability
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: proof:demo-console-clean (H.W0 — the H-A1 serializeEasing crash is dead)
              run: npm run proof:demo-console-clean
              env:
                  KF_REQUIRE_BROWSER: "1"
            # H.W1 KEYSTONE — the live scene+playback FSM gate: the (scenes²×
            # {playing,paused}) identity matrix + the raw-rAF contract round-trip +
            # no-route-storm (DRIVEN, not idle) + scene-isolation + deep-link-wins +
            # suspend-no-orphan-raf + no-timing-heuristic, all driven IN-PAGE via
            # the hash reconcile (goto clears storage). Each clause BITES on its
            # exact D12 defect; KF_REQUIRE_BROWSER turns a playwright-absent skip
            # into a hard CI fail (the keystone cannot pass vacuously).
            - name: proof:scene-machine-irrefragable (H.W1 — the live scene+playback FSM identity matrix + the six focused clauses)
              run: npm run proof:scene-machine-irrefragable
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: proof:dock-popover-opens (H.W1 S8/BLK-8 — the @mbabb dock popover opens on a trusted click)
              run: npm run proof:dock-popover-opens
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: proof:single-toggle (H.W1 S8/BLK-8 — the @mbabb trigger carries exactly one toggle)
              run: npm run proof:single-toggle
              env:
                  KF_REQUIRE_BROWSER: "1"
            # H.W3 (WV-W3-MED-2) — the single-column pack + mis-size lock: at
            # 1440×900 / #/cube / pane open, every LEAF row (.controls-content
            # .labeled-field, visible) shares ONE left edge AND ONE width (±2px),
            # with a ≥6 non-vacuity guard. Born-RED on the pre-W3 two-track grid
            # (left edges {76,300}, width Δ=254). Settle-gated on the H.W1 FSM
            # resting; KF_REQUIRE_BROWSER turns a playwright-absent skip into a
            # hard CI fail (the column pack cannot pass vacuously).
            - name: proof:single-column-pack (H.W3 — the leaf-row single-column + mis-size lock)
              run: npm run proof:single-column-pack
              env:
                  KF_REQUIRE_BROWSER: "1"
            # H.W3 — the rail-width binding lock: at 1440×900 / #/cube / pane open,
            # the timeline + pane (border-box) + AnimationControls root (content-box)
            # all resolve to the SINGLE --rail-width authority (the D4 1272/768/400
            # three-regime spread is dead) + the mobile companion (no desktop-cap
            # leak at 390). Settle-gated on the H.W1 FSM resting (the named [rail]
            # var(--rail-width) [stage] grid resolving); KF_REQUIRE_BROWSER turns a
            # playwright-absent skip into a hard CI fail (the binding cannot pass
            # vacuously).
            - name: proof:timeline-rail-width (H.W3 — the four-way --rail-width binding + mobile full-bleed)
              run: npm run proof:timeline-rail-width
              env:
                  KF_REQUIRE_BROWSER: "1"
            # H.W3 (WV-W3-HIGH-1) — the rail·stage·rail architecture lock: the
            # static no-legacy grep over the S1–S4 + TimingFunctionPanel scope
            # (zero grid-cols-[auto_1fr]/[subgrid]/col-span-2/col-end-4/col-span-full/
            # grid-template-columns:subgrid, comment-blanked) + the tree-wide
            # --controls-pane-width dead-token deletion + the computed named
            # [rail] var(--rail-width) [stage] 1fr × [top]auto [stage]1fr [bottom]auto
            # template. Settle-gated on the H.W1 FSM resting (#/cube pinned in-page,
            # viewport re-asserted, pane open, grid resolved to --rail-width);
            # KF_REQUIRE_BROWSER turns a playwright-absent skip into a hard CI fail.
            - name: proof:demo-shell-grid (H.W3 — ONE named rail·stage·rail grid · no legacy two-track apparatus · dead token gone)
              run: npm run proof:demo-shell-grid
              env:
                  KF_REQUIRE_BROWSER: "1"
            # H.W3 S4 (WV-W3-HIGH-3) — the MEASURE-FIRST stage guard: at 1280 & 1440,
            # pane OPEN & CLOSED, the [stage]-cell subject bbox is fully within the
            # viewport (the B.W3 cube-half-clipped invariant). The gate that lets S4
            # ship the stronger [stage]-track form; the col-end-4 conservative span
            # is the documented fallback if it ever clips. KF_REQUIRE_BROWSER turns a
            # playwright-absent skip into a hard CI fail (a clip cannot pass vacuously).
            - name: proof:stage-not-clipped (H.W3 S4 — the stage subject is un-clipped at 1280/1440 · open/closed)
              run: npm run proof:stage-not-clipped
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: proof:computed-real-dom (G.W16 S2 — the C5 50dvh fix on the genuine layout path)
              run: npm run proof:computed-real-dom
              env:
                  KF_REQUIRE_BROWSER: "1"
            # C.W1 S6 — the lighthouse A11y=100 (demo-owned) + SEO≥90 hard gate
            # W5 deferred. Drives each scene into its OPEN-panel editing state
            # (the product as USED, not the splash) and scores a11y+seo. HARD on
            # any a11y audit OUTSIDE the two named allowance buckets
            # (bucket-glassui → ASK-3 adoption; bucket-w2 → W2 close), on any
            # regression of an already-passing audit, and on SEO<90. The buckets
            # are an explicit manifest in the script — not a silent exemption —
            # and the gate tightens by deletion as those closes land. lighthouse
            # resolves from the repo root (the `npm i --no-save lighthouse` above).
            - name: A11y (demo-owned) = 100 + SEO ≥ 90 — open-panel lighthouse gate
              run: node scripts/lighthouse-gate.mjs
              env:
                  KF_REQUIRE_BROWSER: "1"
            # D.W1/W2/W3 demo refinement gates — source + built-CSS instruments,
            # each BITES on its exact regression. They run AFTER the gh-pages
            # build above so proof:brittleness's @supports clause reads the real
            # built demo CSS (dist/gh-pages/). No browser needed (grep + built-CSS
            # scan) — they slot in beside the existing demo gates.
            - name: proof:decomposition (D.W1 — ceilings · ONE parse adapter · pure utils re-homed · no rAF/timeout blobs)
              run: npm run proof:decomposition
            - name: proof:no-deprecated-guard (H.W1 S5 — the deprecated next() nav-guard is gone from router.ts)
              run: npm run proof:no-deprecated-guard
            - name: proof:single-writer (H.W1 S9.c — the FSM mutation boundary; no consumer writes activeScene/status)
              run: npm run proof:single-writer
            - name: proof:idioms (D.W2 — owned design-idioms.css · leaf-tail swept · utils.css monolith uncaged)
              run: npm run proof:idioms
            - name: proof:brittleness (D.W3 — no global DOM reach · z-scale single-sourced · @supports guards)
              run: npm run proof:brittleness
            # F.W2 — the THREE inv-tagged demo gates the workflow never ran:
            # proof:dogfood (inv ζ — the shop-window runs its own engine),
            # proof:demo-elevate (inv ο — the SOLE View-Transitions lock + the
            # F.W13-16 a11y/idiom clauses), proof:modern-web (the CWV/modern-web
            # checklist), and proof:platform-adopt (the feature-detected adopts).
            # They scan the demo source (+ the built CSS above), so they ride the
            # demo job after the gh-pages build.
            - name: proof:dogfood (inv ζ — the demo dogfoods the engine, incl. the F.W10 inertia swap)
              run: npm run proof:dogfood
            - name: proof:demo-elevate (inv ο — View Transitions · a11y · idioms · the F.W13-16 clauses)
              run: npm run proof:demo-elevate
            - name: proof:modern-web (the modern-web-guidance checklist)
              run: npm run proof:modern-web
              # The guidance corpus is a local-dev aid (npx modern-web-guidance
              # install) — absent on a clean runner. The gate sanctions this CI
              # escape: every OTHER clause (font-preload · monaco-deferred ·
              # yield · checklist-dispositioned · …) still runs + bites; only the
              # corpus-presence clause is skipped.
              env:
                  KF_MWG_OPTIONAL: "1"
            - name: proof:platform-adopt (the feature-detected platform adopts)
              run: npm run proof:platform-adopt
            # C.W1 S4 — the LoAF >50ms-trace gate: the dev-only LoAF observer's
            # REAL 2nd consumer (closing the LoAF + >50ms-trace chronics + the
            # overfitting violation as ONE perf-evidence subsystem). The gate
            # launches Chromium against a served bench page that mounts the
            # observer EXPLICITLY (the prod demo stays observer-free), drives a
            # large AnimationGroup composite, reads `window.__kfLoaf`, and FAILS
            # on any >50ms main-thread block. It needs the LIBRARY build
            # (`dist/keyframes.js`) the bench page imports — so build:lib runs
            # here LAST (its `dist/` empty no longer disturbs the gh-pages gates
            # above, which have all run). Chromium resolves from the repo
            # (`npm i --no-save @playwright/test` above); KF_REQUIRE_BROWSER
            # turns the playwright-absent skip into a hard CI failure.
            - name: build the library (dist/keyframes.js for the bench page)
              run: npm run build:lib
            # KF_LOAF_COUNT runner-calibration: the strict 50ms LoAF threshold is
            # a real-user-HARDWARE Web-Vitals standard. The shared GitHub VM runs
            # ~6× slower than real hardware, so the full 200-cell composite's loop
            # legitimately blocks ~130ms there (local: 20ms) with NO regression —
            # a single absolute threshold cannot separate that from the bite-test's
            # 120ms injected block. So CI runs a runner-calibrated 48-cell composite
            # (still crosses the YIELD_BATCH=32 boundary → exercises the yield path;
            # loop worst-frame ~30ms, comfortably under the UNCHANGED strict 50ms,
            # and the 120ms inject still reddens). The full 200-cell yield-STRESS is
            # the local/dedicated `npm run bench` authority (real hardware). The
            # threshold itself is NOT relaxed — only the stress size is sized to the
            # runner (cf. tranche-B 5fa76b4: CI perf SMOKE robust, real gate local).
            - name: LoAF >50ms-trace gate (observer's 2nd consumer)
              run: npm run bench -- --run bench/playwright.bench.ts
              env:
                  KF_REQUIRE_BROWSER: "1"
                  KF_LOAF_COUNT: "48"
