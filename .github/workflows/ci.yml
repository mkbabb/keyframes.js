# Merge correctness and publish-boundary workflow for @mkbabb/keyframes.js.
#
# U.A6 collapses the merge path to the three surviving mechanisms: the Vitest
# correctness suite and proof:publish (boundary, published surface, dependency
# floor). Browser/device observations run only on the scheduled/manual roster
# below; they never hold a library merge hostage. The producer library graph has
# no Glass dependency; the later demo-consumer commit owns that registry edge.
name: ci

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]
    schedule:
        - cron: "17 3 * * 1"
    workflow_dispatch: {}

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    gates:
        name: library gates (library tests + proof:publish)
        runs-on: ubuntu-latest
        timeout-minutes: 4
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - name: npm ci
              run: npm ci
            - name: check library types
              run: npm run check:lib
            - name: build library
              run: npm run build:lib
            - name: correctness suite
              run: npm run test:lib
            # MR4 (V.W9) — the demo vitest project (state machines / transport /
            # sharing; jsdom-only, ~2s) runs in NO CI job today (TC-2/AV-3). It
            # gates the 155 demo assertions the FAM-06 restructure churns.
            - name: demo suite
              run: npm run test:demo
            - name: publish boundary
              run: npm run proof:publish

    # U.A7 — the device-dependent demo roster is nightly/on-demand only. A
    # scheduled red is recorded for deploy ancestry; it does not block library
    # merges. Manual dispatch is the explicit break-glass path.
    demo-correctness:
        name: demo correctness (nightly roster)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 50
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - name: npm ci (demo consumer graph)
              run: npm ci
            - name: install playwright
              run: npm i --no-save @playwright/test
            - name: install chromium
              run: npx playwright install --with-deps chromium
            # MR2 (V.W9) — the 5 EN-a/VT/entry/a11y/trigger browser oracles run
            # HERE, where a real chromium exists. They skipIf(!chromium) in every
            # other job (GS-01/TC-1); under a browser they pass 14/14 (R2-04 AV-2),
            # so wiring them is pure signal-add. resolveChromium() finds the pinned
            # revision via the installed @playwright/test + KF_PLAYWRIGHT_DIR; the
            # per-test light bundles are rolldown-built from source (no demo build
            # needed). WATCH ITEM (device parity): R2-04 ran the oracles under
            # system Chrome (channel:'chrome'); these launch a plain
            # chromium.launch(), so the pinned-revision launch on the Linux runner
            # is the unverified edge (the device-dependence history).
            - name: browser oracles (EN-a / VT / entry / a11y / trigger)
              env:
                  KF_PLAYWRIGHT_DIR: ${{ github.workspace }}
              run: >-
                  npx vitest run --project library
                  test/compile/entry-roundtrip.test.ts
                  test/compile/view-transition-roundtrip.test.ts
                  test/orchestration/split-a11y-oracle.test.ts
                  test/engine/en-fix-oracle.test.ts
                  test/scroll/trigger-oracle.test.ts
            - name: build demo
              run: npm run gh-pages
            - name: publish artifact boundary (post-build)
              run: npm run proof:publish
            - name: demo roster (report-all)
              run: npm run demo:correctness -- --timeout=600
              env:
                  KF_REQUIRE_BROWSER: "1"
                  KF_MWG_OPTIONAL: "1"
            # A successful nightly publishes the SHA consumed by deploy-pages.
            - name: record last-demo-green
              if: success()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh api --method POST "repos/${{ github.repository }}/git/refs" \
                    -f "ref=refs/tags/last-demo-green" \
                    -f "sha=${{ github.sha }}" 2>/dev/null || \
                  gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/last-demo-green" \
                    -f "sha=${{ github.sha }}" -F force=true
            # Device-dependent observers are co-scheduled with the nightly roster
            # and remain explicitly non-blocking; no separate merge-path job or
            # demo-device-observe apparatus survives U.A6.
            - name: install browser observers (recorded)
              if: always()
              run: npm i --no-save lighthouse || echo "observer install unavailable; recorded"
            - name: lighthouse audit (recorded)
              if: always()
              run: npm run audit:lighthouse || echo "lighthouse observer red; recorded"
              env:
                  KF_REQUIRE_BROWSER: "1"
