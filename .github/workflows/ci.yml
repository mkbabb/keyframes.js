    demo-smoke:
        name: demo gate (inv γ paints + inv δ occlusion-free)
        runs-on: ubuntu-latest
        # CICD-7 wall-clock bound, RE-CALIBRATED at K.W5 (measure-first; F-2/DL-K13).
        # History: the pre-J.W4 roster measured 19m13s end-to-end (run 27310054675)
        # against the old 20m ceiling; J.W4 added ~9m (mobile-input battery + axes
        # legs + observe-only mobile Lighthouse) → the J.W4 35m ceiling. But that
        # ceiling was NEVER re-verified after the post-J.W4 gate additions: by
        # ci-cd-k.md F-2 the J.W6/J.W7a/H.W12 cohort (subject-animates + single-
        # writer + sheet-reopen + appearance-suffusion + the four motion-path/
        # easter-egg gates) added ~14m → a ~42m PROJECTED total that already EXCEEDS
        # the 35m artifact. K then adds five more browser gates to this job. Their
        # LOCAL wall-clocks (K.W5 measure-first, KF_REQUIRE_BROWSER=1, dist warm):
        #   proof:cold-entry 41s · proof:font-census 41s · proof:layout-cluster 24s ·
        #   proof:spring-slider-continuous 19s · proof:taste-packet 42s ≈ 2.8m local.
        # GHA shared runners run ~1.5–3× slower than dedicated hardware on browser
        # work (ci-cd-k.md F-2), so the K band projects to ~6–9m of CI time over the
        # already-over-budget ~42m → ~48–51m worst-case on a slow runner. The ceiling
        # re-binds to 50m: it BOUNDS the measured projection with a thin margin while
        # still dying far before the 6h GHA default (a real hang is killed). This is a
        # MEASURED recalibration, NOT a blind bump — the durable cure is the W6/W3
        # harness net-deletion (one shared chromium+server, withBrowser reuse) +
        # F-7's static-gate migration out of demo-smoke, both MEASURED, not pre-
        # optimized here (F-2 §Hand-off → W6-infra).
        timeout-minutes: 50
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            # The demo arm needs glass-ui (the library gate does not). It is the
            # PUBLISHED registry package (`@mkbabb/glass-ui ~4.0.0`, the I.W6
            # specular consume-edge — TILDE: 3.9.0 carries `specular="off"`, the
            # B7 bloom-absent contract proof:specular-absent-at-rest gates; the
            # floor lives in proof:deps-current, single-sourced from package.json).
            # `npm ci` installs it from the registry like any dep. No sibling
            # clone, no `file:` link (the pre-re-pin model the spine retired).
            - name: npm ci (installs the registry @mkbabb/glass-ui)
              run: npm ci
            # L.W4 S8 — proof:peer-satisfied: the F-2 peer-cycle tripwire,
            # BORN-RED-BY-DESIGN. glass-ui's PUBLISHED peerDependencies range for
            # @mkbabb/value.js REJECTS the installed value.js (ELSPROBLEMS) — the
            # exact ranges are read FROM the installed manifests by the gate, never
            # hardcoded here. It STAYS RED until glass-ui BB widens the peer range
            # AND kf re-pins (Band-B, L.W9). It rides this report-all demo-smoke job
            # (continue-on-error) so the expected RED is RECORDED in one run; the
            # terminal check-failures step reds the job. DELIBERATELY ABSENT from the
            # blocking proof:hygiene chain (it would abort the && chain on the expected RED).
            - name: "[born-RED tripwire] proof:peer-satisfied (L.W4 S8 — glass-ui's peer range vs the installed value.js; the live F-2 peer-cycle, RED until glass-ui BB widens + kf re-pins)"
              id: proof-peer-satisfied
              continue-on-error: true
              run: npm run proof:peer-satisfied
            - name: install playwright + lighthouse (demo-gate only; --no-save keeps the lib posture)
              run: npm i --no-save @playwright/test lighthouse
            - name: install chromium
              run: npx playwright install --with-deps chromium
            - name: build the demo (gh-pages)
              run: npm run gh-pages
            - name: proof:demo-smoke (inv γ — the demo cannot ship blank)
              id: proof-demo-smoke
              continue-on-error: true
              run: npm run proof:demo-smoke
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: proof:occlusion (inv δ — no page occludes on any viewport)
