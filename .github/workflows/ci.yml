# ci — PR + push-to-master gate matrix for @mkbabb/keyframes.js.
#
# TWO gate postures, by inv β:
#
#   gates (LIBRARY) — glass-ui-FREE. Every step touches only the
#   publishable surface (`src/` → `dist/`):
#     check:lib  — tsc --noEmit -p tsconfig.lib.json   (src/ only; never demo)
#     build:lib  — vite build --mode production         (library entry; externals
#                  value.js + glass-ui; demo graph untouched)
#     test       — vitest (test/, jsdom)                (no glass-ui imports)
#     proof:boundary — bundle EVERY light barrel entry and assert 0 value.js +
#                0 static engine edge per entry, the heavy engine dynamic-only,
#                no dormant static specifier (A inv α, widened in B.W2)
#   `@mkbabb/glass-ui` is a PUBLISHED registry optionalDependency the LIBRARY
#   graph never dereferences — check:lib / build:lib / proof:boundary / test stay
#   glass-ui-free (the library externalizes it; the demo graph is untouched). The
#   G re-pin retired the former local-sibling dev link: the demo now consumes the
#   published registry package like any other dep (proof:ci-coverage forbids a
#   local-link or sibling-clone glass-ui reference in any workflow).
#
#   demo-smoke (DEMO) — the demo legitimately needs glass-ui, so this is a
#   SEPARATE job that `npm ci`-installs the published registry package + a browser
#   and asserts the BUILT gh-pages demo paints (B inv γ) and occludes nothing
#   (B inv δ). A blank/tree-shaken build or an occluded page fails CI here.
#
# Cross-repo dependency-order note: keyframes.js resolves @mkbabb/value.js
# via the npm registry (range declared in `package.json`). A breaking value.js
# publish surfaces here at the `npm ci` + build:lib step — the standard
# chore(deps) bump routes the breakage through a PR. The floor is single-sourced
# in `package.json`'s declared range, not hardcoded here (proof:ci-coverage's
# version-literal clause forbids a bare workflow literal that disagrees with it).
name: ci

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]

# Cancel superseded runs on the same ref to save minutes (the constellation
# guard — `deploy/templates/ci.yml`). The gates job is ~17 proof gates + tsc +
# build + test; demo-smoke is a Playwright + lighthouse + LoAF matrix.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    gates:
        name: library gate (glass-ui-free)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            # S.A0 — proof:published-on-master asserts release-tag → master
            # ANCESTRY (`git rev-list -n1 v<version>` + `merge-base --is-ancestor`
            # against origin/master); the default shallow depth-1 checkout carries
            # neither tags nor history, so that gate exited 128 ("unknown
            # revision") on every CI run since its authoring. Full history + tags
            # make the ancestry assertion actually runnable on the runner.
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            # kf runs Node 24 — the newest runtime the published lib will face;
            # constellation default is 22; engines floor is >=22 (a NAMED delta,
            # not silent drift — a library should test the newest runtime).
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - run: npm ci
            - name: proof:deps-current (G.W2 — @mkbabb/* pins current · protocol-clean · realm-convergent)
              run: npm run proof:deps-current
            - name: check (tsc --noEmit, library-scoped)
              run: npm run check:lib
            - name: build (library)
              run: npm run build:lib
            - name: dts artefact is real + the 15 public runtime symbols roll up
              run: |
                  test -f dist/keyframes.d.ts
                  bytes=$(wc -c < dist/keyframes.d.ts)
                  echo "dist/keyframes.d.ts = $bytes bytes"
                  test "$bytes" -gt 10000
                  # The 15 PUBLIC runtime symbols the library ships: the 14 light
                  # barrel exports + the loadAnimationEngine dynamic accessor. Each
                  # must roll up to the dts as a PRECISE `export declare …` anchor
                  # — NOT a loose substring. The former `grep "class Animation"`
                  # matched the `Animation_2` collision-rename / `AnimationGroup` /
                  # `AnimationOptionError`, proving none of them; a dropped symbol
                  # passed green. A symbol ships either directly
                  # (`export declare class|function|const NAME…`) or, when
                  # API-Extractor must collision-rename it (`<Name>_2`), as an
                  # `export { <rename> as NAME }` aliased re-export — either proves it.
                  # NOTE (Q.WE1): the @deprecated `ScrollTimeline` alias was DROPPED
                  # in 5.0.0; the canonical name is `KeyframesScrollTimeline` (the
                  # collision-free PKG-3 class — rolls up as a direct declaration).
                  SYMS="NumericAnimation SmoothProgress SpringProgress springLinearStops springTimingFunction ElementMorph Timeline KeyframesScrollTimeline ManualTimeline RAFPlayback resolveEasing toEasing AnimationOptionError UnknownEasingError loadAnimationEngine"
                  missing=""
                  for sym in $SYMS; do
                    if grep -qE "^export declare (abstract class|class|function|const|enum) ${sym}[<(:; ]" dist/keyframes.d.ts \
                       || grep -qE "^export \{ [A-Za-z0-9_]+ as ${sym} \}" dist/keyframes.d.ts; then
                      :
                    else
                      missing="$missing $sym"
                    fi
                  done
                  if [ -n "$missing" ]; then
                    echo "dts MISSING public runtime symbol declaration(s):$missing"
                    exit 1
                  fi
                  echo "dts public-symbol set complete: 15/15"
            - name: test
              run: npm test -- --run
            # J.W5 — the PUBLISH/DOCS boundary oracle (library-scoped: built dist +
            # `npm pack --dry-run`, no demo build, no browser). Clause (a) tarball ==
            # files declaration (no `_redirects`), (b) every public export taught or
            # manifested, (d) AnimationEngine interface ≡ runtime surface (ENG-6),
            # (e) root CLAUDE.md structural-claim tripwire, (f) peer-dep honesty.
            - name: proof:published-surface (J.W5 — tarball == exports == docs · the publish-boundary oracle)
              run: npm run proof:published-surface
            # Q.WE1 — the NO-LEGACY breaking-surface oracle: the three @deprecated
            # PKG-3 aliases (Animation / ScrollTimeline / ScrollTimelineOptions)
            # are GONE from the BUILT dist/keyframes.d.ts (the consumer's installed
            # surface). Runs AFTER build:lib, same precondition as proof:published-
            # surface. HARD posture — a correctness/precept invariant.
            - name: proof:alias-dropped (Q.WE1 — the @deprecated aliases are GONE from the published d.ts · NO-LEGACY)
              run: npm run proof:alias-dropped
            # T.M8 (lane 27 F9) — the three S.B6 type-surface / ./engine-drift gates
            # folded out of their dev-only orphan status into a real tier. They read
            # the BUILT dist/keyframes.d.ts (same precondition as proof:published-
            # surface / proof:alias-dropped above — after build:lib), so they ride the
            # gates job here + proof:hygiene-chain (local truth). Was: EXCLUDED as
            # "development-only" (never CI-wired) since S.B6.
            - name: proof:engine-subpath-mirror (T.M8/F9 — ./engine subpath mirrors the AnimationEngine keys)
              run: npm run proof:engine-subpath-mirror
            - name: proof:no-any-default (T.M8/F9 — no `any` in the default type surface)
              run: npm run proof:no-any-default
            - name: proof:dts-rollups-agree (T.M8/F9 — the d.ts roll-ups agree)
              run: npm run proof:dts-rollups-agree
            # T.M — the born-OWNER gate class mechanism (batch ①). Pure static reads
            # (docs/tree/package.json), no browser, no dist — so they ride the fast
            # gates job + proof:hygiene-chain. Each is green-today (M1/M2 vacuous or
            # clean; M6/M7 registry-derived; M9 board-live; M10 recap teeth). The
            # BORN-RED backlog gates (proof:stage-inventory / -subject-legible /
            # -subject-full / -roster-ceiling) are DECLARED in scripts/gate-bands.mjs
            # T_BORNRED_BACKLOG + EXCLUDED in proof:ci-coverage (recorded, not blocking).
            - name: proof:owner-verdict-recorded (T.M1 — K's TASTE-VERDICT revived, blocking per-wave)
              run: npm run proof:owner-verdict-recorded
            - name: proof:owner-review-gate (T.M2 — pre-authoring sign-off + convergence≠sufficient)
              run: npm run proof:owner-review-gate
            - name: proof:gate-authority (T.M6 — the INSTRUMENT/OWNER authority axis + blocking-not-OBSERVE)
              run: npm run proof:gate-authority
            - name: proof:retirement-ledger (T.M7 — feature-coupled retirement, derive-from-tree)
              run: npm run proof:retirement-ledger
            - name: proof:board-live (T.M9 — board↔tree + session-log freshness)
              run: npm run proof:board-live
            - name: proof:prompt-recap-t (T.M10 — the born-OWNER recap gate teeth)
              run: npm run proof:prompt-recap-t
            # S.C1 — the GENERALIZED breaking-set MIGRATION-doc oracle (C-18): git-
            # reconstructs the previous published tag's docs/published-surface.md, diffs it
            # against HEAD, and REDs on any removed public-surface row lacking a matching
            # docs/MIGRATION-<version>.md entry (version-agnostic semver honesty).
            - name: proof:changelog (S.C1 · C-18 — every removed published-surface row is documented in docs/MIGRATION-<version>.md)
              run: npm run proof:changelog
            # K.W12 ED-1 — the agent index (/llms.txt + /llms-full.txt) can never
            # drift from the J.W5 published surface (the gate-ORACLE at the AGENT
            # boundary: linked exports == the manifest roster, cited gates real).
            - name: proof:agent-surface (K.W12 ED-1 — the agent index == the published surface)
              run: npm run proof:agent-surface
            # R.W4 — the honest API "in": the @mkbabb/keyframes.js/engine subpath
            # resolves the heavy surface statically (the Quick Start's `new
            # CSSKeyframesAnimation`), the Quick Start fence is `ts run`-enforced, and
            # the agent-surface phantom-export check is co-asserted. Library-scoped.
            - name: proof:in-is-importable (R.W4 — the honest "in" · ./engine subpath + ts-run Quick Start)
              run: npm run proof:in-is-importable
            # L.W6 — the agent-authoring VERB (validate/explain): the round-trip's
            # FORWARD half, the VALIDATION layer over the compile surface. A HEAVY-
            # surface oracle that runs in jsdom/node (no browser, no demo build), so
            # it rides the library `gates` job beside proof:agent-surface. Asserts
            # the verb exists + is boundary-clean (HEAVY, import-type on the barrel),
            # the /llms.txt LOOP teaching is fresh, and the (c)/(d) behaviour locks.
            - name: proof:agent-validate (L.W6 — the agent-authoring verb · validate/explain)
              run: npm run proof:agent-validate
            # K.W12 ED-3 — the dogfood inversion boundary-ORACLE at the PACKAGE
            # boundary (STAGED: the self-alias seam + the @src deep-import census
            # + the honest disposition; the full flip lands at K.WZ).
            - name: proof:demo-on-published-surface (K.W12 ED-3 — the demo consumes the published barrel · staged)
              run: npm run proof:demo-on-published-surface
            # K.W12 ED-4 — the public color-fidelity conformance: midpoint ΔE vs
            # the CSS Color 4 reference (via the PUBLISHED deltaEOK), under the
            # JND. The ONE benchmark only kf can publish honestly (un-spinnable).
            - name: proof:color-fidelity (K.W12 ED-4 — midpoint ΔE vs CSS Color 4 · the un-spinnable benchmark)
              run: npm run proof:color-fidelity
            # J.W5 clause (c) — every README §Beyond CSS / §Animation runnable snippet
            # EXECUTES against the built dist; `// =>` results verified; the
            # taught-roster floor forbids the under-tagging false-green.
            - name: proof:readme-runs (J.W5 — the README snippets EXECUTE against dist)
              run: npm run proof:readme-runs
            # R.W7 — README paths live: every ](src/…) link resolves, no stale
            # `Animation` class-name reference, Quick Start fence is `ts run` + has
            # an import line. Paired with proof:readme-runs (R.W4 ensures execution;
            # R.W7 ensures the cited paths exist + the class name is canonical).
            - name: proof:readme-paths-live (R.W7 — README src/ links live · no stale Animation · Quick Start ts run)
              run: npm run proof:readme-paths-live
            - name: proof:boundary (value.js static/dynamic boundary gate, all light entries)
              run: npm run proof:boundary
            - name: "proof:consume-bundle (M.W9 atlas — a LIGHT-surface consumer drags zero value.js/engine)"
              run: npm run proof:consume-bundle
            - name: "proof:css-parity (M.W11 — kf consumes value.js grammar; P0/nesting/depth-walk cured)"
              run: npm run proof:css-parity
            - name: "proof:packrat-sound (M.W10 — consumed parse-that packrat is sound + LR-intact)"
              run: npm run proof:packrat-sound
            - name: proof:engine (D.W4 transposition source gate — tick-canon · seam · pause-honest · snap-symmetry · no-legacy)
              run: npm run proof:engine
            - name: proof:compile-backward-leg (S.B3 — compile/ FORWARD/BACKWARD layering · no re-export bridge · no cross-zone deep-import)
              run: npm run proof:compile-backward-leg
            - name: proof:no-flat-siblings (R.W1 — the 11-zone directory partition · no flat-hyphenated siblings · zone barrels · known-violations dissolved)
              run: npm run proof:no-flat-siblings
            - name: proof:no-orphan-module (S.C1 — dynamic-import-aware reachability walker + the scoped front-door `animate` grep; the zero-importer zombie class made structural)
              run: npm run proof:no-orphan-module
            - name: proof:no-dead-dependency (S.C3a — the 8 zero-importer shadcn devDeps + SPRING_SMOOTH denylist, the dead-identifier grep; the shadcn census clause is NON-GATING, discharged at S.C3b)
              run: npm run proof:no-dead-dependency
            - name: proof:zero-alloc (AnimationGroup composite allocates 0 bytes/frame + FrameCompiler seam + snap symmetry)
              run: npm run proof:zero-alloc
            # F.W2 — the library-scoped engine/correctness gates the workflow
            # previously never ran (E's engine-correctness/standalone-zero-alloc/
            # compile-deterministic + the whole F gate cohort). Each is a vitest
            # run / node script over src/ — no demo build needed, so they ride
            # the fast library job.
            - name: proof:engine-correctness (E.W7 — five engine correctness locks)
              run: npm run proof:engine-correctness
            - name: proof:standalone-zero-alloc (E.W7 — the standalone play-loop buffer)
              run: npm run proof:standalone-zero-alloc
            - name: proof:compile-deterministic (E.W8 — byte-deterministic compile ids)
              run: npm run proof:compile-deterministic
            - name: proof:compile-replay (K.W10 — THE COMPILE; the round-trip's BACKWARD half replays equal or REFUSES)
              run: npm run proof:compile-replay
            - name: proof:replay-equality (L.W1 — the replay-equality FLOOR; @property/per-stop-composition/named-selector/composite round-trip; keyframe !important spec-faithfully dropped)
              run: npm run proof:replay-equality
            - name: proof:orchestration (F.W3 — stagger/FLIP/decay/Sequence behaviour locks)
              run: npm run proof:orchestration
            - name: proof:transport-events (L.W5 S3 — Sequence segment/label crossing callback channel)
              run: npm run proof:transport-events
            - name: proof:interp-fastprops (F.W4 — the dict-mode buffer fold + single-frame alias)
              run: npm run proof:interp-fastprops
            - name: proof:sync-step (F.W5 — the drive sync fast-path + the event-ordering lock)
              run: npm run proof:sync-step
            - name: proof:event-ordering (J.W6 S1/FB-2 — animationstart → iteration* → animationend · paint-before-event · awaited play resolves after end)
              run: npm run proof:event-ordering
            - name: proof:roundtrip-easing (F.W7 — per-keyframe + spring linear() round-trip)
              run: npm run proof:roundtrip-easing
            - name: proof:adapter-capture (F.W8 — composition capture + shorthand-applied + AST-decide)
              run: npm run proof:adapter-capture
            - name: proof:blend (G.W17 — the dead add/weighted blend leaf, element-wise)
              run: npm run proof:blend
            - name: proof:composition-honored (K.W7 — the engine HONORS the animation-composition operator add/accumulate/composite)
              run: npm run proof:composition-honored
            - name: proof:diagnostics-channel (K.W7 — ResolvedKeyframes.diagnostics consumes the value.js ParseDiagnostic producer)
              run: npm run proof:diagnostics-channel
            - name: proof:spring-blend-weight (K.W11 — the layer blend weight is spring-driven, zero-alloc on the constant path)
              run: npm run proof:spring-blend-weight
            - name: proof:scroll-roundtrip (K.W9 — the scroll-timeline grammar round-trips via value.js 0.13.0; native-vs-JS dispatch)
              run: npm run proof:scroll-roundtrip
            - name: proof:drawsvg (G.W13 — CSS-native DrawSVG, WAAPI-eligible)
              run: npm run proof:drawsvg
            - name: proof:finished (G.W13 — the .finished completion front-door)
              run: npm run proof:finished
            - name: proof:adopt-compiled (G.W19 — the adoptCompiled() engine seam)
              run: npm run proof:adopt-compiled
            - name: proof:interpolate-anything (G.W15 — value-type breadth + color fidelity)
              run: npm run proof:interpolate-anything
            - name: proof:roundtrip-fidelity (G.W16 — parse→format→reparse byte-same midpoint)
              run: npm run proof:roundtrip-fidelity
            - name: proof:ingest-replay (K.W8 — the round-trip FORWARD; CSSOM walk replays equal to source)
              run: npm run proof:ingest-replay
            - name: proof:orbital-rotate3d (G.W18 — the orbital rotate3d output collapse)
              run: npm run proof:orbital-rotate3d
            - name: proof:scene-raf-leak (G.W9 — the scene rAF-leak lifecycle correction)
              run: npm run proof:scene-raf-leak
            - name: proof:scene-contract-identity (H.W1 — the raw-rAF ScenePlayback round-trip + easing↔cube cross-pairs)
              run: npm run proof:scene-contract-identity
            - name: proof:group-snapshot-identity (H.W1 — the born-RED engine serialize()/hydrate() HANDOFF witness)
              run: npm run proof:group-snapshot-identity
            - name: proof:resize-tracks (G.W3 — cqw tracks a non-window container resize)
              run: npm run proof:resize-tracks
            - name: proof:cohesion (F.W11 — clamp convergence · inverted-tier · preset reachability)
              run: npm run proof:cohesion
            - name: proof:repin-witness (G.W2 — the C1 computed-endpoint memo resolves O(frames)→O(1) on kf's path)
              run: npm run proof:repin-witness
            - name: proof:bench-runs (F.W1 — the compile/interp/parser benches run, non-empty)
              run: npm run proof:bench-runs
            # L.W7 S6 (Lane 33) — proof:bench-taxonomy: the budgeted bench manifest
            # (bench/taxonomy.json). Every bench case is classified {run-check |
            # budgeted | observe-only | cross-repo}; budgeted floors (the lerpArray
            # SoA win at K=8, the spring-vector probe, the warmEngine pre-resolve)
            # are asserted (observe-only/wall-clock in CI per the taxonomy posture
            # row — RECORDED, never red on the slow runner; hard on-device); the
            # VJ.L1–VJ.L8 color-math asks are dispatched to value.js Tranche O. A
            # vitest-bench run over src/ — no demo build, so it rides the library job.
            - name: proof:bench-taxonomy (L.W7 S6 — the budgeted bench taxonomy · lerpArray SoA + spring-vector + warmEngine floors · VJ.L1–VJ.L8 cross-repo dispatch)
              run: npm run proof:bench-taxonomy
            # L.W7 S4 (W123) — proof:scheduler-posttask: the scheduler.postTask
            # priority-bands born-RED probe. SKIP-when-absent (jsdom/Node lack the
            # API) + the device-INDEPENDENT assertion that yieldToMain's
            # scheduler.yield fast-path is unaffected by warmEngine's "background"
            # postTask adoption. A vitest run over src/ — library job.
            - name: proof:scheduler-posttask (L.W7 S4 — scheduler.postTask "background" probe · yieldToMain yield-path unaffected)
              run: npm run proof:scheduler-posttask
            # L.W7 S5 (W40) — proof:epf1-measure: the EPF-1 ingest read/write
            # phase-separation MEASURE-FIRST gate. OBSERVE-ONLY (category
            # forced-layout per inv-L-device-honesty — carries its taxonomy posture
            # row): it records the device-INDEPENDENT layout-thrash COUNT baseline
            # (scripts/epf1-baseline.json), exits 0 regardless. The 50%-reduction
            # floor opens only when the batch-reads/batch-writes cure ships under
            # EPF1_CURE=1 (NOT in L.W7). Library job.
            - name: proof:epf1-measure (L.W7 S5 — the EPF-1 ingest read/write thrash baseline · observe-only · forced-layout)
              run: npm run proof:epf1-measure
            # L.W7 S2 (W122) — proof:spring-vector: the SpringProgress vector-sugar
            # MEASURE-FIRST ADOPT-or-KILL probe. Asserts the recorded verdict
            # (scripts/spring-vector-decision.json): ADOPT (>=20% at K=8 →
            # setTargets(Float64Array) authorized) OR KILL (the sugar is not built —
            # no unproven code). A vitest-bench probe over src/ — library job.
            - name: proof:spring-vector (L.W7 S2 — the SpringProgress vector-sugar ADOPT-or-KILL probe · MEASURE-FIRST, no unproven code)
              run: npm run proof:spring-vector
            # H.W8 S1 (I-1) — the SCENES manifest is RE-SOURCED from demo/app/scene/scenes.ts:
            # the runtime SCENES keys ≡ scenes.ts ids (bidirectional set-equality, NOT a
            # hard count — auto-tracks every scene add/remove). A new scene with no manifest
            # entry, or a stale manifest key, reds — so the 3 previously-unmanifested scenes
            # (sequence/motion-path were never gate-visited) are enrolled in every runtime gate.
            - name: proof:manifest-sourced (H.W8 S1/I-1 — SCENES keys ≡ scenes.ts ids · auto-enrolls every scene)
              run: npm run proof:manifest-sourced
            # I.W7 S6 (RE-TARGETED S.A4) — proof:gate-is-runtime: THE META-GATE that makes
            # the gate-ORACLE precept MECHANICALLY PRIOR (RED-1). For EVERY proof:demo-
            # correctness member (the S.A4-renamed browser-actuator tier) — the roster is
            # DERIVED from the tier's membership (J.W3 S4/T4), never a hardcoded list — it
            # asserts the script opens a browser (serveDist + KF_PLAYWRIGHT_DIR + newContext,
            # inline or via the lib lifecycle) AND actuates (click/dispatch/mouse/key/drag/
            # navToScene-SWITCH) AND is wired into the demo-correctness tier of proof:all;
            # the SYMMETRIC clause asserts every proof:library-correctness member carries NO
            # browser harness (mis-tier reds BOTH ways). A source-shape / load-rest / proxy
            # §Hard gate FAILS. HYGIENE-tier itself (it reads gate SCRIPTS) — static, no build.
            - name: "[HYGIENE-meta] proof:gate-is-runtime (I.W7 S6 · S.A4 — every demo-correctness gate is an actuating runtime gate + every library-correctness gate is harness-free · mis-tier reds both ways)"
              run: npm run proof:gate-is-runtime
            # I.W7 S4 + S.A1 — proof:chronic-closure: parse the canonical chronic table
            # (docs/tranches/S/PROGRESS.md §"Open deferrals", which SUPERSEDES R's, the
            # R→S re-point) and assert each kf-runtime-closing row exits via a RUNTIME gate
            # that BIT AND the S.A1 SUBSTANCE clause holds — a *-TERMINATED terminal-claim
            # must cite a deterministic re-shaped gate (device dependence folded OUT so it
            # REDs honestly on any runner; macOS reproduction is the discriminator, the
            # Linux-container apparatus DROPPED — SA-7) or a ratified KILL, and no
            # disposition may launder a deferral verb (observe/watch/re-affirm/verify) over
            # a sacred 6-cell parse shape (C-20/SA-6/T3-x2-#8). Static, HYGIENE-tier, no
            # browser. BORN-RED BY DESIGN during the S drive: the S ledger is the forward
            # disposition board, so the runtime-gate contract discharges as each owning wave
            # lands its gate; this meta-gate GREENs only re-run on the merged tree at S.Z2.
            # NOT a CI step until then (the claude-paths-live pattern — S.A5): a
            # deliberately-red forward-board meta-gate in the blocking job would red CI
            # outside the S.A0 backlog. It stays a proof:hygiene-chain member (local truth
            # + the S.Z3 from-clean closeable-roster run) and is EXCLUDED-with-rationale in
            # proof:ci-coverage; S.Z2 re-wires this step in the same commit that re-runs it
            # green (its RE-EXECUTION clause).
            - name: proof:ci-coverage (F.W2 — every proof:* gate is invoked in CI)
              run: npm run proof:ci-coverage
            # M.W1 — proof:report-all: the parallel report-all runner meta-gate.
            # Plants a real multi-red tree + observes that scripts/run-all.mjs
            # (the new proof:all) surfaces EVERY red in ONE pass (the serial `&&`
            # chain aborts-first → the O(N²) 3-hr iterate-to-green, cured). Node-only
            # (sandbox child processes), library-scoped, no browser/demo build.
            - name: "[HYGIENE-meta] proof:report-all (M.W1 — the orchestrated proof:all reports every red in one pass · concurrency actuated · no red swallowed · tier membership intact)"
              run: npm run proof:report-all
            # L.W4 S5 — proof:no-single-option-select: the U4 lone-option count-guard
            # is live in every scene-driven <Select> (animation + control-tab). STATIC
            # (no browser, glass-ui-free) — reads the demo Vue SFC tree, asserts the
            # `length > 1` count guard. A future component re-rendering a single-option
            # dropdown unconditionally reds. Rides the library gates job (device-independent).
