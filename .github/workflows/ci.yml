# Merge correctness and publish-boundary workflow for @mkbabb/keyframes.js.
#
# U.A6 collapsed the merge path to the library mechanisms: the Vitest
# correctness suite and proof:publish (boundary, published surface, dependency
# floor). X.KF.W4 widens it to the DEMO: the jsdom demo project and the lint
# tier run as blocking steps of the library-gates job, and the browser roster
# below is no longer event-gated. The producer library graph has no Glass
# dependency; the later demo-consumer commit owns that registry edge.
name: ci

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]
    schedule:
        - cron: "17 3 * * 1"
    workflow_dispatch: {}

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    gates:
        name: library gates (library tests + proof:publish)
        runs-on: ubuntu-latest
        timeout-minutes: 4
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - name: npm ci
              run: npm ci
            - name: check library types
              run: npm run check:lib
            # X.KF.W4 (G-KFW4-1) — THE SFC TYPE GATE ON THE MERGE PATH. The step
            # above is `tsc -p tsconfig.lib.json` over `include: ["src/"]`: plain
            # `tsc` cannot parse an SFC, so before this line NO `.vue` file was
            # typechecked anywhere in this repo, on any path, and a broken
            # template could not fail a build. `check` is the wave's redefined
            # composite — `vue-tsc -p tsconfig.json` (src + demo, SFCs included)
            # && `tsc -p tsconfig.test.json` && `proof:structure`.
            #
            # DECLARED RED, not a green no-op: this step fails today. The wave's
            # goal criterion is that a `.vue` file CAN fail a build on the merge
            # path, and the honest way to reach it is to wire the gate that
            # measures it and let it report, never to wire a softened one. The
            # diagnostics it reports are booked with named owners (KF.W5 for the
            # `src/` `noUnusedLocals` residues, KF.W6 / KF.W7 / the UNIT packets
            # for the demo surface); `continue-on-error`, `|| true` and a
            # known-violations allowlist are each forbidden by this wave's own
            # standing law, and none is used here.
            - name: check types (SFC + tests + structure)
              run: npm run check
            - name: build library
              run: npm run build:lib
            - name: correctness suite
              run: npm run test:lib
            # X.KF.W4 — the demo lane is a MERGE-PATH gate, not a nightly
            # observation. `test:demo` is the jsdom vitest project (27 specs);
            # `lint` is the source-graph cruise over src + demo plus the
            # eslint-plugin-vue ESSENTIALS tier over the SFC templates. Both
            # block. A demo defect that used to surface (at best) in a nightly
            # whose colour nobody read now fails the pull request that authors it.
            - name: demo correctness suite
              run: npm run test:demo
            - name: lint (source graph + SFC templates)
              run: npm run lint
            - name: publish boundary
              run: npm run proof:publish

    # X.KF.W4 (G-KFW4-2) — the demo roster is now a MERGE-PATH job. U.A7 had it
    # behind `schedule || workflow_dispatch` with the standing note that "a
    # scheduled red is recorded for deploy ancestry; it does not block library
    # merges" — so the demo's only browser-level correctness instrument could go
    # red indefinitely without stopping a single merge. The event gate is
    # REMOVED: the roster runs on pull_request and push as well, and it blocks.
    # The schedule/dispatch triggers survive for deploy ancestry, which is the
    # one thing the nightly was genuinely for.
    demo-correctness:
        name: demo correctness (browser roster)
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 50
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - name: npm ci (demo consumer graph)
              run: npm ci
            - name: install playwright
              run: npm i --no-save @playwright/test
            - name: install chromium
              run: npx playwright install --with-deps chromium
            - name: build demo
              run: npm run gh-pages
            - name: publish artifact boundary (post-build)
              run: npm run proof:publish
            - name: demo roster (report-all)
              run: npm run demo:correctness -- --timeout=600
              env:
                  KF_REQUIRE_BROWSER: "1"
                  KF_MWG_OPTIONAL: "1"
            # A successful push/schedule run publishes the SHA consumed by
            # deploy-pages. Pull-request runs are excluded by event, not by
            # convenience: `github.sha` is the ephemeral merge commit there, and
            # a fork PR's token carries no `contents: write` — tagging deploy
            # ancestry from either would be false ancestry.
            - name: record last-demo-green
              if: >-
                  success() && (github.event_name == 'push' ||
                  github.event_name == 'schedule')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh api --method POST "repos/${{ github.repository }}/git/refs" \
                    -f "ref=refs/tags/last-demo-green" \
                    -f "sha=${{ github.sha }}" 2>/dev/null || \
                  gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/last-demo-green" \
                    -f "sha=${{ github.sha }}" -F force=true
            # Device-dependent observers are co-scheduled with the nightly roster
            # and remain explicitly non-blocking; no separate merge-path job or
            # demo-device-observe apparatus survives U.A6.
            - name: install browser observers (recorded)
              if: always()
              run: npm i --no-save lighthouse || echo "observer install unavailable; recorded"
            - name: lighthouse audit (recorded)
              if: always()
              run: npm run audit:lighthouse || echo "lighthouse observer red; recorded"
              env:
                  KF_REQUIRE_BROWSER: "1"
