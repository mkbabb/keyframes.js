# Merge correctness and publish-boundary workflow for @mkbabb/keyframes.js.
#
# One job of cheap gates: types, build, the library and jsdom demo suites,
# lint, and proof:publish. No browser runs in Actions (owner order 2026-11-13):
# the browser oracles, the demo roster and Lighthouse run locally before a ship
# via `npm run preship` (scripts/preship.sh). deploy-pages ships on this
# workflow's green master push.
name: ci

on:
    pull_request:
        branches: [master]
        paths-ignore:
            - "docs/**"
            - "**/*.md"
    push:
        branches: [master]
        paths-ignore:
            - "docs/**"
            - "**/*.md"
    workflow_dispatch: {}

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    gates:
        name: library gates (library tests + proof:publish)
        runs-on: ubuntu-latest
        timeout-minutes: 10 # hang guard, not a perf bar: ~2.2x the measured step sum ~4m31s (npm ci 35s, types 22s, build 9s, correctness 56s, demo correctness 1m55s, lint 5s, proof:publish 16s); COHESION §0hg
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - name: npm ci
              run: npm ci
            - name: check library types
              run: npm run check:lib
            # X.KF.W4 (G-KFW4-1) — THE SFC TYPE GATE ON THE MERGE PATH. The step
            # above is `tsc -p tsconfig.lib.json` over `include: ["src/"]`: plain
            # `tsc` cannot parse an SFC, so before this line NO `.vue` file was
            # typechecked anywhere in this repo, on any path, and a broken
            # template could not fail a build. `check` is the wave's redefined
            # composite — `vue-tsc -p tsconfig.json` (src + demo, SFCs included)
            # && `tsc -p tsconfig.test.json` && `proof:structure`.
            #
            # DECLARED RED, not a green no-op: this step fails today. The wave's
            # goal criterion is that a `.vue` file CAN fail a build on the merge
            # path, and the honest way to reach it is to wire the gate that
            # measures it and let it report, never to wire a softened one. The
            # diagnostics it reports are booked with named owners (KF.W5 for the
            # `src/` `noUnusedLocals` residues, KF.W6 / KF.W7 / the UNIT packets
            # for the demo surface); `continue-on-error`, `|| true` and a
            # known-violations allowlist are each forbidden by this wave's own
            # standing law, and none is used here.
            - name: check types (SFC + tests + structure)
              run: npm run check
            # `npm ci` already ran `prepare` (build:lib): no second build.
            - name: correctness suite
              run: npm run test:lib
            # X.KF.W4 — the demo lane is a MERGE-PATH gate, not a weekly
            # observation. `test:demo` is the jsdom vitest project (27 specs);
            # `lint` is the source-graph cruise over src + demo plus the
            # eslint-plugin-vue ESSENTIALS tier over the SFC templates. Both
            # block. A demo defect that used to surface (at best) in a weekly run
            # whose colour nobody read now fails the pull request that authors it.
            #
            # X.KF.W10 G-7 (the `v/w9-staging` landing) — MR4 CONVERGED HERE.
            # The staged branch carried its own `demo suite` step running the
            # identical `npm run test:demo`; X.KF.W4 reached the same cure first
            # and named it `demo correctness suite`. MR4's goal criterion ("the
            # demo vitest project runs in NO CI job today") is MET by this step,
            # so the staged duplicate is DROPPED at the landing rather than
            # wired twice — a second identical run is waste and a false second
            # signal. MR4's package.json leg (`test:demo`) was already applied
            # verbatim at the frontier. Recorded, not silently discarded.
            - name: demo correctness suite
              run: npm run test:demo
            - name: lint (source graph + SFC templates)
              run: npm run lint
            - name: publish boundary
              run: npm run proof:publish
