# ci — PR + push-to-master gate matrix for @mkbabb/keyframes.js.
#
# TWO gate postures, by inv β:
#
#   gates (LIBRARY) — glass-ui-FREE. Every step touches only the
#   publishable surface (`src/` → `dist/`):
#     check:lib  — tsc --noEmit -p tsconfig.lib.json   (src/ only; never demo)
#     build:lib  — vite build --mode production         (library entry; externals
#                  value.js + glass-ui; demo graph untouched)
#     test       — vitest (test/, jsdom)                (no glass-ui imports)
#     proof:boundary — bundle EVERY light barrel entry and assert 0 value.js +
#                0 static engine edge per entry, the heavy engine dynamic-only,
#                no dormant static specifier (A inv α, widened in B.W2)
#   `@mkbabb/glass-ui` is a PUBLISHED registry optionalDependency the LIBRARY
#   graph never dereferences — check:lib / build:lib / proof:boundary / test stay
#   glass-ui-free (the library externalizes it; the demo graph is untouched). The
#   G re-pin retired the former local-sibling dev link: the demo now consumes the
#   published registry package like any other dep (proof:ci-coverage forbids a
#   local-link or sibling-clone glass-ui reference in any workflow).
#
#   demo-smoke (DEMO) — the demo legitimately needs glass-ui, so this is a
#   SEPARATE job that `npm ci`-installs the published registry package + a browser
#   and asserts the BUILT gh-pages demo paints (B inv γ) and occludes nothing
#   (B inv δ). A blank/tree-shaken build or an occluded page fails CI here.
#
# Cross-repo dependency-order note: keyframes.js resolves @mkbabb/value.js
# via the npm registry (range declared in `package.json`). A breaking value.js
# publish surfaces here at the `npm ci` + build:lib step — the standard
# chore(deps) bump routes the breakage through a PR. The floor is single-sourced
# in `package.json`'s declared range, not hardcoded here (proof:ci-coverage's
# version-literal clause forbids a bare workflow literal that disagrees with it).
name: ci

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]

# Cancel superseded runs on the same ref to save minutes (the constellation
# guard — `deploy/templates/ci.yml`). The gates job is ~17 proof gates + tsc +
# build + test; demo-smoke is a Playwright + lighthouse + LoAF matrix.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    gates:
        name: library gate (glass-ui-free)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5
            # kf runs Node 24 — the newest runtime the published lib will face;
            # constellation default is 22; engines floor is >=22 (a NAMED delta,
            # not silent drift — a library should test the newest runtime).
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - run: npm ci
            - name: proof:deps-current (G.W2 — @mkbabb/* pins current · protocol-clean · realm-convergent)
              run: npm run proof:deps-current
            - name: check (tsc --noEmit, library-scoped)
              run: npm run check:lib
            - name: build (library)
              run: npm run build:lib
            - name: dts artefact is real + the 15 public runtime symbols roll up
              run: |
                  test -f dist/keyframes.d.ts
                  bytes=$(wc -c < dist/keyframes.d.ts)
                  echo "dist/keyframes.d.ts = $bytes bytes"
                  test "$bytes" -gt 10000
                  # The 15 PUBLIC runtime symbols the library ships: the 14 light
                  # barrel exports + the loadAnimationEngine dynamic accessor. Each
                  # must roll up to the dts as a PRECISE `export declare …` anchor
                  # — NOT a loose substring. The former `grep "class Animation"`
                  # matched the `Animation_2` collision-rename / `AnimationGroup` /
                  # `AnimationOptionError`, proving none of them; a dropped symbol
                  # passed green. A symbol ships either directly
                  # (`export declare class|function|const NAME…`) or, when
                  # API-Extractor must collision-rename it (`ScrollTimeline_2`), as
                  # an `export { <rename> as NAME }` aliased re-export — either proves it.
                  SYMS="NumericAnimation SmoothProgress SpringProgress springLinearStops springTimingFunction ElementMorph Timeline ScrollTimeline ManualTimeline RAFPlayback resolveEasing toEasing AnimationOptionError UnknownEasingError loadAnimationEngine"
                  missing=""
                  for sym in $SYMS; do
                    if grep -qE "^export declare (abstract class|class|function|const|enum) ${sym}[<(:; ]" dist/keyframes.d.ts \
                       || grep -qE "^export \{ [A-Za-z0-9_]+ as ${sym} \}" dist/keyframes.d.ts; then
                      :
                    else
                      missing="$missing $sym"
                    fi
                  done
                  if [ -n "$missing" ]; then
                    echo "dts MISSING public runtime symbol declaration(s):$missing"
                    exit 1
                  fi
                  echo "dts public-symbol set complete: 15/15"
            - name: test
              run: npm test -- --run
            # J.W5 — the PUBLISH/DOCS boundary oracle (library-scoped: built dist +
            # `npm pack --dry-run`, no demo build, no browser). Clause (a) tarball ==
            # files declaration (no `_redirects`), (b) every public export taught or
            # manifested, (d) AnimationEngine interface ≡ runtime surface (ENG-6),
            # (e) root CLAUDE.md structural-claim tripwire, (f) peer-dep honesty.
            - name: proof:published-surface (J.W5 — tarball == exports == docs · the publish-boundary oracle)
              run: npm run proof:published-surface
            # J.W5 clause (c) — every README §Beyond CSS / §Animation runnable snippet
            # EXECUTES against the built dist; `// =>` results verified; the
            # taught-roster floor forbids the under-tagging false-green.
            - name: proof:readme-runs (J.W5 — the README snippets EXECUTE against dist)
              run: npm run proof:readme-runs
            - name: proof:boundary (value.js static/dynamic boundary gate, all light entries)
              run: npm run proof:boundary
            - name: proof:engine (D.W4 transposition source gate — tick-canon · seam · pause-honest · snap-symmetry · no-legacy)
              run: npm run proof:engine
            - name: proof:zero-alloc (AnimationGroup composite allocates 0 bytes/frame + FrameCompiler seam + snap symmetry)
              run: npm run proof:zero-alloc
            # F.W2 — the library-scoped engine/correctness gates the workflow
            # previously never ran (E's engine-correctness/standalone-zero-alloc/
            # compile-deterministic + the whole F gate cohort). Each is a vitest
            # run / node script over src/ — no demo build needed, so they ride
            # the fast library job.
            - name: proof:engine-correctness (E.W7 — five engine correctness locks)
              run: npm run proof:engine-correctness
            - name: proof:standalone-zero-alloc (E.W7 — the standalone play-loop buffer)
              run: npm run proof:standalone-zero-alloc
            - name: proof:compile-deterministic (E.W8 — byte-deterministic compile ids)
              run: npm run proof:compile-deterministic
            - name: proof:orchestration (F.W3 — stagger/FLIP/decay/Sequence behaviour locks)
              run: npm run proof:orchestration
            - name: proof:interp-fastprops (F.W4 — the dict-mode buffer fold + single-frame alias)
              run: npm run proof:interp-fastprops
            - name: proof:sync-step (F.W5 — the drive sync fast-path + the event-ordering lock)
              run: npm run proof:sync-step
            - name: proof:event-ordering (J.W6 S1/FB-2 — animationstart → iteration* → animationend · paint-before-event · awaited play resolves after end)
              run: npm run proof:event-ordering
            - name: proof:roundtrip-easing (F.W7 — per-keyframe + spring linear() round-trip)
              run: npm run proof:roundtrip-easing
            - name: proof:adapter-capture (F.W8 — composition capture + shorthand-applied + AST-decide)
              run: npm run proof:adapter-capture
            - name: proof:motion-path (F.W12 — CSS-native MotionPath eligibility + compositor)
              run: npm run proof:motion-path
            - name: proof:blend (G.W17 — the dead add/weighted blend leaf, element-wise)
              run: npm run proof:blend
            - name: proof:drawsvg (G.W13 — CSS-native DrawSVG, WAAPI-eligible)
              run: npm run proof:drawsvg
            - name: proof:finished (G.W13 — the .finished completion front-door)
              run: npm run proof:finished
            - name: proof:adopt-compiled (G.W19 — the adoptCompiled() engine seam)
              run: npm run proof:adopt-compiled
            - name: proof:interpolate-anything (G.W15 — value-type breadth + color fidelity)
              run: npm run proof:interpolate-anything
            - name: proof:roundtrip-fidelity (G.W16 — parse→format→reparse byte-same midpoint)
              run: npm run proof:roundtrip-fidelity
            - name: proof:orbital-rotate3d (G.W18 — the orbital rotate3d output collapse)
              run: npm run proof:orbital-rotate3d
            - name: proof:asset-store-singleton (G.W8 — useAssetManager createGlobalState identity)
              run: npm run proof:asset-store-singleton
            - name: proof:scene-raf-leak (G.W9 — the scene rAF-leak lifecycle correction)
              run: npm run proof:scene-raf-leak
            - name: proof:scene-contract-identity (H.W1 — the raw-rAF ScenePlayback round-trip + easing↔cube cross-pairs)
              run: npm run proof:scene-contract-identity
            - name: proof:group-snapshot-identity (H.W1 — the born-RED engine serialize()/hydrate() HANDOFF witness)
              run: npm run proof:group-snapshot-identity
            - name: proof:resize-tracks (G.W3 — cqw tracks a non-window container resize)
              run: npm run proof:resize-tracks
            - name: proof:cohesion (F.W11 — clamp convergence · inverted-tier · preset reachability)
              run: npm run proof:cohesion
            - name: proof:repin-witness (G.W2 — the C1 computed-endpoint memo resolves O(frames)→O(1) on kf's path)
              run: npm run proof:repin-witness
            - name: proof:bench-runs (F.W1 — the compile/interp/parser benches run, non-empty)
              run: npm run proof:bench-runs
            # H.W8 S1 (I-1) — the SCENES manifest is RE-SOURCED from demo/app/scenes.ts:
            # the runtime SCENES keys ≡ scenes.ts ids (bidirectional set-equality, NOT a
            # hard count — auto-tracks every scene add/remove). A new scene with no manifest
            # entry, or a stale manifest key, reds — so the 3 previously-unmanifested scenes
            # (sequence/motion-path were never gate-visited) are enrolled in every runtime gate.
            - name: proof:manifest-sourced (H.W8 S1/I-1 — SCENES keys ≡ scenes.ts ids · auto-enrolls every scene)
              run: npm run proof:manifest-sourced
            # I.W7 S6 — proof:gate-is-runtime: THE META-GATE that makes the gate-ORACLE
            # precept MECHANICALLY PRIOR (RED-1). For EVERY proof:correctness member —
            # the roster is DERIVED from the tier's membership (J.W3 S4/T4), never a
            # hardcoded list — it asserts the script opens a browser (serveDist +
            # KF_PLAYWRIGHT_DIR + newContext, inline or via the lib lifecycle) AND
            # actuates (click/dispatch/mouse/key/drag/navToScene-SWITCH) AND is wired
            # into the correctness tier of proof:all. A source-shape / load-rest /
            # proxy §Hard gate FAILS. HYGIENE-tier itself (it reads gate SCRIPTS) — it
            # polices the GATES' SHAPE; static, no browser/build.
            - name: "[HYGIENE-meta] proof:gate-is-runtime (I.W7 S6 — every wave's §Hard gate is an actuating runtime gate wired to the correctness tier · the precept, machine-enforced)"
              run: npm run proof:gate-is-runtime
            # I.W7 S4 — proof:chronic-closure REWIRED: parse the canonical chronic table
            # (docs/tranches/I/PROGRESS.md §"Open deferrals", which SUPERSEDES H's) and
            # assert each row exits via a RUNTIME gate that BIT — its script opens a
            # browser AND actuates AND was witnessed born-RED — wired to the correctness
            # tier. A source-shape / load-rest / proxy gate, a vaporware-targeted HANDOFF,
            # or a wrong-axis gate REDS. RETIRED gate names required ABSENT (the dual). It
            # polices the chronic ROWS' cited gates; static, HYGIENE-tier, no browser.
            - name: "[HYGIENE-meta] proof:chronic-closure (I.W7 S4 — every chronic exits via a RUNTIME gate that BIT · vaporware HANDOFF + wrong-axis gate red · the keystone fixed)"
              run: npm run proof:chronic-closure
            - name: proof:ci-coverage (F.W2 — every proof:* gate is invoked in CI)
              run: npm run proof:ci-coverage

    demo-smoke:
        name: demo gate (inv γ paints + inv δ occlusion-free)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            # The demo arm needs glass-ui (the library gate does not). It is the
            # PUBLISHED registry package (`@mkbabb/glass-ui ~3.11.2`, the I.W6
            # specular consume-edge — TILDE: 3.9.0 carries `specular="off"`, the
            # B7 bloom-absent contract proof:specular-absent-at-rest gates; the
            # floor lives in proof:deps-current, single-sourced from package.json).
            # `npm ci` installs it from the registry like any dep. No sibling
            # clone, no `file:` link (the pre-re-pin model the spine retired).
            - name: npm ci (installs the registry @mkbabb/glass-ui)
              run: npm ci
            - name: install playwright + lighthouse (demo-gate only; --no-save keeps the lib posture)
              run: npm i --no-save @playwright/test lighthouse
            - name: install chromium
              run: npx playwright install --with-deps chromium
            - name: build the demo (gh-pages)
              run: npm run gh-pages
            - name: proof:demo-smoke (inv γ — the demo cannot ship blank)
              run: npm run proof:demo-smoke
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: proof:occlusion (inv δ — no page occludes on any viewport)
              run: npm run proof:occlusion
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: proof:demo-usability (G.W11 — Discrete route reachable · hero word-gap · unique Play aria)
              run: npm run proof:demo-usability
              env:
                  KF_REQUIRE_BROWSER: "1"
            # ════════════════════════════════════════════════════════════════
            # I.W7 — THE CORRECTNESS TIER (the gate-ORACLE precept, S1/S5). Each
            # gate opens the BUILT dist + ACTUATES the product (CLICK play, SWITCH
            # via the dock, fire visibilitychange, DRAG) and reads a product-facing
            # property under KF_REQUIRE_BROWSER=1 (a playwright-absent skip is a
            # hard fail). These RETIRED (I.W7 S5) the five H proxy gates — each
            # superseded by the correctness-tier gate here that ACTUATES the
            # property its proxy could only approximate (console budget →
            # live-session; token-peak → perf-frame-budget; recorded specular
            # residue → specular-absent-at-rest; load-time icons → icon-paint-live;
            # static dragscrub → drag-gesture).
            # proof:live-session is THE HEADLINE — the one interaction-driven
            # battery whose accumulated error budget = 0 + product-facing DOM is the
            # union of every wave's leg.
            # ════════════════════════════════════════════════════════════════
            - name: "[CORRECTNESS] proof:engine-no-throw-on-play (I.W0/B1+B5 — the rainbow group-play click is total · cube paints · no '......' parse line)"
              run: npm run proof:engine-no-throw-on-play
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: "[CORRECTNESS] proof:subject-animates (J.W6 P0 — the subject-write seam oracle: every play path WRITES the interpolated frame to its subject, not just the playhead · born-RED on the apply=false _renderFrame break)"
              run: npm run proof:subject-animates
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: "[CORRECTNESS] proof:fsm-suspend-resume-live (I.W1/B2 — synthetic visibilitychange on a playing raw-rAF scene raises NO _gen throw · resume-iff-was-playing)"
              run: npm run proof:fsm-suspend-resume-live
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: "[CORRECTNESS] proof:easing-editor-live (I.W2/B4 — switch-into-easing mounts the curve canvas + a handle-drag mutates the path)"
              run: npm run proof:easing-editor-live
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: "[CORRECTNESS] proof:amiga-subject-is-pivot (I.W3/B3 — a centre-drag moves the SUBJECT not the room · no ReadPixels GPU stall)"
              run: npm run proof:amiga-subject-is-pivot
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: "[CORRECTNESS] proof:drag-gesture (I.W4/B6 — a real drag selects no chrome text + the box transform persists)"
              run: npm run proof:drag-gesture
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: "[CORRECTNESS] proof:perf-frame-budget (I.W4/B8 — dock expand + easing preview hold the felt frame budget under a CPU throttle)"
              run: npm run proof:perf-frame-budget
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: "[CORRECTNESS] proof:icon-paint-live (I.W5/B9+K — every SceneDescriptor.icon PAINTS · zero asset-404 · document.title === keyframes.js · live VT)"
              run: npm run proof:icon-paint-live
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: "[CORRECTNESS] proof:specular-absent-at-rest (I.W6/B7 — the glass ::before catch-light bloom is ABSENT at rest, by the rendered pixels)"
              run: npm run proof:specular-absent-at-rest
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: "[CORRECTNESS] proof:demo-fonts (I.W6-font — the body + dock + control chrome carry NO Plus Jakarta · display is Instrument Serif)"
              run: npm run proof:demo-fonts
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: "[CORRECTNESS] proof:live-session (I.W7 THE HEADLINE — ONE interaction-driven session: PLAY + SWITCH + DRAG · error budget = 0 + product-facing DOM)"
              run: npm run proof:live-session
              env:
                  KF_REQUIRE_BROWSER: "1"
                  KF_DEV_SERVER: "1"
            # [HYGIENE] proof:visual-lock — RE-TIERED to HYGIENE (I.W7 S5). The
            # self-captured, subject-masked pixel baseline locks brokenness as golden
            # (rc-gate-blindspot §2.3); it is KEPT (cheap layout/type/color drift
            # check) but STRIPPED of correctness authority — the appearance-axis
            # correctness now lives in proof:live-session + proof:specular-absent-at-
            # rest + proof:amiga-subject-is-pivot (which assert the live subject ALIVE,
            # not painted pink). It may NEVER count toward a correctness/chronic tally.
            - name: "[HYGIENE] proof:visual-lock (RE-TIERED — self-baseline drift check; correctness authority STRIPPED, see proof:live-session)"
              run: npm run proof:visual-lock
              env:
                  KF_REQUIRE_BROWSER: "1"
            # H.W1 KEYSTONE — the live scene+playback FSM gate: the (scenes²×
            # {playing,paused}) identity matrix + the raw-rAF contract round-trip +
            # route-stability (DRIVEN re-renders fire zero scene-changing navs) +
            # scene-isolation + deep-link-wins +
            # suspend-no-orphan-raf + no-timing-heuristic, all driven IN-PAGE via
            # the hash reconcile (goto clears storage). Each clause BITES on its
            # exact D12 defect; KF_REQUIRE_BROWSER turns a playwright-absent skip
            # into a hard CI fail (the keystone cannot pass vacuously).
            # [HYGIENE] proof:scene-machine-irrefragable — RE-TIERED to HYGIENE
            # (I.W7 S5). Its oracle is a localStorage JSON snapshot round-trip (a
            # proxy store that stubs the live adapter + never fires visibilitychange,
            # rc-gate-blindspot §2.2) — a useful PURE-REDUCER serialization hygiene
            # check, KEPT, but STRIPPED of correctness authority: the B2 suspend
            # correctness now lives in proof:fsm-suspend-resume-live (which exercises
            # the LIVE adapter + its _gen, not the snapshot).
            - name: "[HYGIENE] proof:scene-machine-irrefragable (RE-TIERED — pure-reducer snapshot round-trip; correctness authority STRIPPED, see proof:fsm-suspend-resume-live)"
              run: npm run proof:scene-machine-irrefragable
              env:
                  KF_REQUIRE_BROWSER: "1"
            # H.W11 S4 / I2 — the per-scene control-surface DFA (the third orthogonal
            # axis on the W1 keystone, EXTENDS the FSM — proof:scene-machine-irrefragable
            # stays GREEN above). For EVERY scene the rendered control-surface set EXACTLY
            # equals the DFA table entry (easing → ONLY easing, NO keyframes/timeline node;
            # sequence/motion-path → NO control panel; cube → the full triad), and the
            # (scene → scene) navigation matrix is TOTAL (no undefined cell, no stale
            # surface bleed). STATIC half (the table-driven render + the reka-hacks-die
            # source anchors) + the unit-locked DFA core (test/control-surface-dfa.test.ts).
            # Born-RED on the W10 baseline (the hard-coded controls/keyframes/timeline triad
            # at AnimationControls.vue:20-22 + the reka-fallback hacks). Settle-gated on the
            # H.W1 FSM resting; KF_REQUIRE_BROWSER turns a playwright-absent skip into a hard
            # CI fail (the per-scene + navigation-matrix clauses cannot pass vacuously).
            - name: proof:scene-control-dfa (H.W11 S4/I2 — each scene renders ONLY its valid control-surface set · the navigation matrix is total · the DFA EXTENDS W1)
              run: npm run proof:scene-control-dfa
              env:
                  KF_REQUIRE_BROWSER: "1"
            # J.W2 S2 (DS-1/S4) — the selectedControl single-WRITER completion over the
            # DFA: the live scene sweep renders the DFA projection per entry, the
            # cross-store purity holds after the sweep (no leaving-scene store corrupted
            # by a mid-transition cross-scene write — the recorded Easing-holds-'spring'
            # witness), and the matrix fallback happens AT the authority (the CubeScene
            # rogue write is gone). Born-RED on the pre-J.W2 tree; KF_REQUIRE_BROWSER
            # turns a playwright-absent skip into a hard CI fail.
            - name: proof:control-surface-single-writer (J.W2 S2/DS-1 — ONE writing authority for selectedControl · cross-store purity over the sweep · matrix fallback at the authority)
              run: npm run proof:control-surface-single-writer
              env:
                  KF_REQUIRE_BROWSER: "1"
            # H.W11 S4 / I2 — the DFA's MEASURE-FIRST transition-performance budget
            # (bench:scene-transition). The cross-scene navigate + control-surface re-render
            # settles within the measured budget (BUDGET_MS=120, named from the W11 baseline
            # p95≈46ms — ~2.6× headroom, under the ~200ms feels-instant INP threshold, still
            # biting a real regression), AND the control-surface state suspends-on-leave +
            # fully-resumes on SCENE_READY (the easing↔cube round-trip identity, EXTENDING
            # the W1 proof:scene-machine-irrefragable field set with the {selectedControl,
            # control-surfaces} projection). STATIC half (the DFA source + the
            # reducer-untouched anchor) always runs. Born-RED on the W10 baseline (the DFA
            # source is ABSENT). Settle-gated on the H.W1 FSM resting; KF_REQUIRE_BROWSER
            # turns a playwright-absent skip into a hard CI fail (the budget + round-trip
            # cannot pass vacuously).
            - name: proof:scene-transition-perf (H.W11 S4/I2 — the MEASURE-FIRST transition budget settles ≤120ms · the control-surface round-trip identity EXTENDS W1)
              run: npm run proof:scene-transition-perf
              env:
                  KF_REQUIRE_BROWSER: "1"
            - name: proof:dock-popover-opens (H.W1 S8/BLK-8 — the @mbabb dock popover opens on a trusted click)
              run: npm run proof:dock-popover-opens
              env:
                  KF_REQUIRE_BROWSER: "1"
            # RETIRED (I.W7 S5): the dock-morph token-peak proxy — a source-shape
            # gate that parsed the `--spring-dock` token's peak ("no morph captured
            # live", rc-gate-blindspot §2.5). SUPERSEDED by the CORRECTNESS-tier
            # proof:perf-frame-budget above, which drives the dock hover-expand +
            # measures the FELT frame budget under a CPU throttle (the dropped-frame
            # axis the token-peak proxy structurally could not see). Script git-rm'd.
            - name: proof:single-toggle (H.W1 S8/BLK-8 — the @mbabb trigger carries exactly one toggle)
              run: npm run proof:single-toggle
              env:
                  KF_REQUIRE_BROWSER: "1"
            # H.W9 F5 — the whole dark-mode row is the toggle target: open the @mbabb
            # dock menu (the proof:dock-popover-opens plumbing), click the dark-mode row
            # at its LABEL gutter (NOT the icon) → <html>.dark flips; click again → flips
            # back, exactly ONCE per click (no double-toggle from the passive icon). Plus
            # a static source-shape clause (the row @click="toggleDark" + the passive
            # prop). Born-RED today (the label click is inert — only the icon flips).
            # KF_REQUIRE_BROWSER turns a playwright-absent skip into a hard CI fail.
            - name: proof:darkmode-row-toggle (H.W9 F5 — the dark-mode row label flips the theme once per click · passive indicator icon)
              run: npm run proof:darkmode-row-toggle
              env:
                  KF_REQUIRE_BROWSER: "1"
            # H.W9 F9 — the controls idle-fade restoration: at 1440×900 / #/cube / pane
            # OPEN, after >10s of GLOBAL window inactivity (a real wait — useIdle resets
            # on any synthetic event) the wrapper carries .controls-pane--idle and its
            # opacity drops to --controls-idle-opacity (≈0.35 < the resting 1); hover →
            # returns to 1. Non-vacuity: the resting opacity must be 1 so the dim is a
