# Cloudflare Pages deploy-of-record for keyframes.babb.dev.
#
# U.A8/U.Z4: a push deploy requires the library CI workflow to be green and the
# latest successful scheduled demo (`last-demo-green`) to be an ancestor of the
# deploy SHA. Manual dispatch is an explicit break-glass path.
name: deploy-pages

on:
    workflow_run:
        workflows: ["ci"]
        types: [completed]
    workflow_dispatch: {}

concurrency:
    group: deploy-pages-${{ github.event.workflow_run.head_sha || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    actions: read

jobs:
    deploy-preflight:
        name: preflight (library CI + last-demo-green ancestry)
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'master' &&
             github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
            - name: assert library CI conclusion
              if: github.event_name != 'workflow_dispatch'
              run: test "${{ github.event.workflow_run.conclusion }}" = success
            - name: assert last-demo-green is an ancestor
              if: github.event_name != 'workflow_dispatch'
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  set -euo pipefail
                  DEMO_SHA=$(gh api "repos/${{ github.repository }}/git/ref/tags/last-demo-green" --jq '.object.sha')
                  echo "last-demo-green=${DEMO_SHA} deploy=${DEPLOY_SHA}"
                  git cat-file -e "${DEMO_SHA}^{commit}"
                  git merge-base --is-ancestor "${DEMO_SHA}" "${DEPLOY_SHA}"

    deploy:
        name: build demo + ship → Cloudflare Pages
        needs: deploy-preflight
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'master' &&
             github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - name: npm ci (demo consumer graph)
              run: npm ci
            - name: build demo + deploy to Cloudflare Pages
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: bash scripts/pages-deploy.sh
