# Cloudflare Pages deploy-of-record for keyframes.babb.dev.
#
# A push deploy requires the ci workflow to be green on master. The browser
# roster that used to tag `last-demo-green` no longer runs in Actions (owner
# order 2026-11-13); it runs locally before a ship via `npm run preship`.
name: deploy-pages

on:
    workflow_run:
        workflows: ["ci"]
        types: [completed]
    workflow_dispatch: {}

concurrency:
    group: deploy-pages-${{ github.event.workflow_run.head_sha || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    deploy:
        name: build demo + ship → Cloudflare Pages
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'master' &&
             github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - name: npm ci (demo consumer graph)
              run: npm ci
            - name: build demo + deploy to Cloudflare Pages
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: bash scripts/pages-deploy.sh
