# deploy-pages.yml — keyframes.babb.dev's deploy-of-record (the constellation
# CF-Pages spine, adopted per `mkbabb/deploy` cf/pages-deploy.sh).
#
# keyframes.babb.dev is a Cloudflare Pages project (`keyframes` →
# keyframes-8uq.pages.dev), deployed via wrangler — NOT GitHub Pages (the old
# gh-pages/deploy.yml path served a parallel site the DNS never pointed at; it is
# RETIRED). This workflow is the standing automated path: it builds the demo +
# ships it to CF Pages.
#
# GREEN-CI-GATED (the constellation inv-28, verified-deploy-of-record): it
# triggers on the `ci` workflow *completing* and deploys ONLY when that same-SHA
# run is GREEN, on a master push. A red CI → the deploy job's `if` is false → the
# SPA does NOT ship. `workflow_run` drops `paths:`, so the `changes` job re-imposes
# the demo-relevant path filter against the triggering commit.
#
# SECRET DISCIPLINE: CLOUDFLARE_API_TOKEN (Pages:Edit + Read) + CLOUDFLARE_ACCOUNT_ID
# are GH Actions repo secrets, consumed via ${{ secrets.* }}, never inlined/echoed.
name: deploy-pages

on:
    workflow_run:
        workflows: ["ci"]
        types: [completed]
    workflow_dispatch: {}

concurrency:
    group: deploy-pages-${{ github.event.workflow_run.head_sha || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    changes:
        name: gate (green CI + demo-relevant change)
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'master' &&
             github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest
        outputs:
            should_deploy: ${{ steps.filter.outputs.should_deploy }}
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
                  fetch-depth: 2
            - id: filter
              name: re-impose the demo path filter (workflow_run drops paths:)
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                    echo "should_deploy=true" >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  base="$(git rev-parse HEAD^ 2>/dev/null || true)"
                  if [[ -z "$base" ]]; then
                    echo "should_deploy=true" >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  # The demo SPA is built from demo/ + src/ + the styles/config +
                  # this deploy machinery. A docs-only or test-only commit does
                  # not re-ship.
                  if git diff --name-only "$base" HEAD \
                       | grep -qE '^(demo/|src/|index\.html|vite\.config\.ts|package(-lock)?\.json|tailwind\.config\.|postcss\.config\.|scripts/pages-deploy\.sh$|\.github/workflows/deploy-pages\.yml$)'; then
                    echo "should_deploy=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "should_deploy=false" >> "$GITHUB_OUTPUT"
                  fi

    deploy:
        name: build demo + ship → Cloudflare Pages
        needs: changes
        if: needs.changes.outputs.should_deploy == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            # The demo legitimately needs glass-ui (the library does not). Mirror
            # ci.yml's demo-smoke: check out + build the PINNED glass-ui sibling
            # the file:../glass-ui optional dep points at, so the demo build
            # resolves it exactly as a dev machine does.
            - name: check out + build the glass-ui sibling (file:../glass-ui, pinned)
              run: |
                  git clone --depth 1 --branch v3.2.0 https://github.com/mkbabb/glass-ui.git "$GITHUB_WORKSPACE/../glass-ui"
                  cd "$GITHUB_WORKSPACE/../glass-ui"
                  npm ci
                  npm run build
            - name: npm ci (picks up the built file:../glass-ui)
              run: npm ci
            # scripts/pages-deploy.sh builds the demo (BUILD_CMD=npm run gh-pages →
            # dist/gh-pages) and ships it to the `keyframes` CF Pages project.
            - name: build demo + deploy to Cloudflare Pages
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: bash scripts/pages-deploy.sh
