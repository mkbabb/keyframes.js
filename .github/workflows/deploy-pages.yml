# Cloudflare Pages deploy-of-record for keyframes.babb.dev.
#
# U.A8/U.Z4: a push deploy requires the library CI workflow to be green and the
# latest successful scheduled demo (`last-demo-green`) to be an ancestor of the
# deploy SHA.
#
# MR3 (V.W9): manual dispatch is NO LONGER a silent bypass. Before MR3 both
# preflight asserts were guarded `!= workflow_dispatch`, so a manual dispatch
# skipped them entirely (AV-4) — and with DP-02 the demo builds fine but renders
# blank, so a dispatch would ship the blank demo green. Now a dispatch enforces
# the same ancestry by default; the flaky-roster escape is an EXPLICIT, logged
# `require_demo_green=false` break-glass, not an implicit property of the trigger.
name: deploy-pages

on:
    workflow_run:
        workflows: ["ci"]
        types: [completed]
    workflow_dispatch:
        inputs:
            require_demo_green:
                description: "Enforce last-demo-green ancestry (uncheck ONLY for genuine break-glass)"
                type: boolean
                default: true

concurrency:
    group: deploy-pages-${{ github.event.workflow_run.head_sha || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    actions: read

jobs:
    deploy-preflight:
        name: preflight (library CI + last-demo-green ancestry)
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'master' &&
             github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
            # MR3: `!= workflow_dispatch || inputs.require_demo_green`. Under
            # workflow_run the left disjunct is TRUE and short-circuits, so this
            # path is byte-identical to before (the asserts run). Under dispatch
            # the left disjunct is FALSE, so the guard collapses to
            # `inputs.require_demo_green` — default TRUE enforces; explicit FALSE
            # is the documented break-glass that skips (and is visible in the run).
            - name: assert library CI conclusion
              if: github.event_name != 'workflow_dispatch' || inputs.require_demo_green
              run: test "${{ github.event.workflow_run.conclusion }}" = success
            - name: assert last-demo-green is an ancestor
              if: github.event_name != 'workflow_dispatch' || inputs.require_demo_green
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  set -euo pipefail
                  DEMO_SHA=$(gh api "repos/${{ github.repository }}/git/ref/tags/last-demo-green" --jq '.object.sha')
                  echo "last-demo-green=${DEMO_SHA} deploy=${DEPLOY_SHA}"
                  git cat-file -e "${DEMO_SHA}^{commit}"
                  git merge-base --is-ancestor "${DEMO_SHA}" "${DEPLOY_SHA}"

    deploy:
        name: build demo + ship → Cloudflare Pages
        needs: deploy-preflight
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'master' &&
             github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: "npm"
            - name: npm ci (registry glass-ui)
              run: npm ci
            - name: build demo + deploy to Cloudflare Pages
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: bash scripts/pages-deploy.sh
