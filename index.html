        <!-- Fonts loaded non-blocking: media="print" prevents render-block,

            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&display=swap"

            onload="this.media='all'"

        </noscript>

        <!-- Sync dark mode class before first paint to prevent FOUC on Safari -->
        <script>
            (function() {
                var s = localStorage.getItem('vueuse-color-scheme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var dark = s === 'dark' || (s !== 'light' && (s === 'auto' || s == null) && prefersDark);
                if (dark) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.style.colorScheme = 'dark';
                }
            })();
        </script>
